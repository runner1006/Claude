services:
  - type: web
    name: oefb-daten
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: oefb-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: OEFB_DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ADMIN_TOKEN
        sync: false
      - key: MCP_TOKEN
        sync: false
