<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖFB Daten-Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C0D14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2334B190'/%3E%3C/svg%3E">
<style>
  :root{
    /* Strykerlabs/Nova-Palette: Grund #0C0D14, Karte #181B2F, Linie #353649, Akzent #34B190 (nie als Flaeche) */
    --bg:#0C0D14; --panel:#141626; --panel2:#1D2036; --line:#2B2E45; --line2:#353649;
    --text:#E3E9F4; --muted:#8A93AD; --accent:#34B190; --accent2:#67CBA0; --info:#00B3F0;
    --good:#34B190; --warn:#FFC22D; --bad:#FF6F70; --violet:#785EF0;
    --font:"Inter","Inter Variable",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;
       background:var(--bg);color:var(--text)}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:sticky;top:0;z-index:6}
  header h1{font-size:17px;margin:0;margin-right:8px}
  header h1 small{color:var(--muted);font-weight:400;font-size:12px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);
        border:1px solid var(--line)}
  .pill.on{color:var(--good);border-color:var(--good)}
  /* --hdrh = gemessene Header-Hoehe (JS, ResizeObserver): der Header bricht auf schmalen Screens um */
  nav{display:flex;flex-wrap:wrap;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);
      position:sticky;top:var(--hdrh,53px);z-index:5}
  nav button{background:none;border:none;color:var(--muted);padding:12px 16px;cursor:pointer;
             font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
  nav button.active{color:var(--text);border-bottom-color:var(--accent)}
  main{padding:18px 20px;max-width:1500px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
  input[type=search],select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
        padding:9px 12px;border-radius:8px;font-size:14px;min-width:0}
  input[type=search]{flex:1;min-width:200px}
  input[type=search]:focus,select:focus{outline:none;border-color:var(--accent2)}
  .count{color:var(--muted);font-size:12px;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:98px;background:var(--bg);z-index:1}
  th:hover{color:var(--text)}
  tbody tr:hover{background:var(--panel)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--muted)}
  .score{font-weight:700;font-variant-numeric:tabular-nums}
  .mrow{cursor:pointer}
  .detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:6px 0 14px;padding:16px}
  .detail h3{margin:0 0 4px}
  .meta{color:var(--muted);font-size:12px;margin-bottom:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .lu h4{margin:0 0 6px;font-size:13px;color:var(--accent2)}
  .lu table{font-size:12px}
  .lu .sub{color:var(--muted);margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .ev{list-style:none;padding:0;margin:0;font-size:13px}
  .ev li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
  .ev .min{width:42px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .ev .ic{width:20px;text-align:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:50px 20px}
  .empty code{background:var(--panel2);padding:2px 6px;border-radius:4px;color:var(--text)}
  .cap{color:var(--warn)}
  a.ext{color:var(--accent2);text-decoration:none}
  a.ext:hover{text-decoration:underline}
  .barbg{background:var(--panel2);border-radius:4px;height:7px;overflow:hidden;min-width:60px}
  .bar{height:100%;background:var(--accent)}
  select{cursor:pointer}
  /* ---- Layout: Sidebar-Filter + Tabelle nebeneinander ---- */
  .tabwrap{display:flex;gap:22px;align-items:flex-start}
  .sidebar{width:300px;flex:none;position:sticky;top:calc(var(--hdrh,53px) + 51px);max-height:calc(100vh - 120px);overflow:auto;
        background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .content{flex:1;min-width:0}
  .content-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:24px}
  .content-head h3{margin:0;font-size:15px}
  /* Schmal: Filter oben, Tabelle darunter. .content braucht width:100%, sonst waechst es in der
     Spaltenrichtung auf die Tabellenbreite (shrink-to-fit) und die ganze Seite scrollt horizontal. */
  @media(max-width:1300px){.sidebar{width:260px}}
  @media(max-width:880px){.tabwrap{flex-direction:column}
    .sidebar{width:100%;position:static;max-height:none}
    .content{width:100%}}
  @media(max-width:600px){main{padding:14px 16px} nav{padding:0 8px} nav button{padding:10px 10px}}
  .sb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sb-title{font-size:15px;font-weight:600}
  .sb-fields{display:flex;flex-direction:column;gap:15px;margin-top:14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .fctl{background:var(--panel2);border:1px solid var(--line);color:var(--text);
        padding:9px 11px;border-radius:9px;font-size:13px;width:100%}
  .fctl:focus{outline:none;border-color:var(--accent2)}
  .fbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
        padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap}
  .fbtn:hover{border-color:var(--accent2);color:var(--text)}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .preset{font-size:11px;padding:4px 9px}
  /* Scroll-Container für die breite Scouting-Tabelle: eigener Scroll (beide
     Achsen), Kopfzeile klebt an dessen Oberkante statt am Viewport. Die max-height gilt auf JEDER
     Breite (auch Handy): die virtuelle Tabelle braucht einen hoehenbegrenzten Container, sonst
     muesste sie alle Zeilen rendern (zusaetzlich per MAXVIS in VirtualTable abgesichert). */
  .tblscroll{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:10px}
  .tblscroll thead th{position:sticky;top:0;z-index:2;background:var(--panel)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chips:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--accent);
        color:var(--text);padding:4px 5px 4px 10px;border-radius:20px;font-size:12px}
  .chip .x{cursor:pointer;color:var(--muted);font-size:16px;line-height:.9;padding:0 4px;border-radius:50%}
  .chip .x:hover{color:#fff}
  .count{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:auto}
  .ms{position:relative}
  .ms-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;
        background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;
        border-radius:9px;font-size:13px;cursor:pointer;text-align:left}
  .ms-btn:hover{border-color:var(--accent2)}
  .ms-caret{color:var(--muted);font-size:10px}
  .ms-pop{display:none;margin-top:6px;background:var(--panel2);border:1px solid var(--line);
        border-radius:9px;padding:6px;max-height:230px;overflow:auto}
  .ms-pop.open{display:block}
  .ms-search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
        padding:6px 9px;border-radius:7px;font-size:12px;margin-bottom:6px}
  .ms-search:focus{outline:none;border-color:var(--accent2)}
  .ms-list{display:flex;flex-direction:column;gap:1px}
  .ms-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;cursor:pointer}
  .ms-opt:hover{background:var(--panel)}
  .ms-opt input{accent-color:var(--accent);flex:none}
  /* ---- Methodik / Erklärung ---- */
  .explain{max-width:1000px;margin:0 auto;line-height:1.65}
  .explain .lead{color:var(--muted);font-size:15px;margin:2px 0 8px}
  .explain .lead b{color:var(--text)}
  .explain .cite{font-size:12px;color:var(--muted);margin:0 0 26px}
  .step{display:grid;grid-template-columns:42px 1fr;gap:16px;margin:0 0 34px}
  .step .n{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
  .step h3{margin:3px 0 8px;font-size:17px}
  .step .body{min-width:0}
  .step p{margin:6px 0}
  .viz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
  .viz svg{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
  .eq{font-family:"Cambria Math","Latin Modern Math","Times New Roman",Georgia,serif;
        font-size:18px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
        padding:16px;margin:14px 0;overflow-x:auto;text-align:center;white-space:nowrap}
  .eq small{font-size:12px;color:var(--muted);display:block;white-space:normal;margin-top:6px;
        font-family:-apple-system,sans-serif;text-align:center}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;font-size:14px}
  .frac .den{border-top:1px solid currentColor;padding-top:1px}
  .big{font-size:24px;vertical-align:-4px;margin:0 2px}
  .t-off{color:#34B190}
  .t-def{color:#FF6F70}
  .t-hfa{color:#00B3F0}
  .t-man{color:#FFC22D}
  .t-reg{color:#785EF0}
  .note{border-left:3px solid var(--accent);background:var(--panel);padding:11px 14px;
        border-radius:0 8px 8px 0;margin:14px 0;font-size:13px;color:var(--muted)}
  .note b{color:var(--text)}
  /* ---- Spielerprofil ---- */
  .plink{color:var(--accent2);cursor:pointer}
  .plink:hover{text-decoration:underline}
  .pf{max-width:1100px;margin:0 auto}
  .pf-search{position:relative;max-width:420px;margin-bottom:18px}
  .pf-sug{position:absolute;top:100%;left:0;right:0;z-index:8;background:var(--panel2);
        border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:280px;overflow:auto}
  .pf-sug:empty{display:none}
  .pf-sug div{padding:7px 11px;cursor:pointer;font-size:13px}
  .pf-sug div:hover{background:var(--panel)}
  .pf-sug small{color:var(--muted)}
  .pf-head{display:flex;gap:18px;align-items:flex-start;background:var(--panel);
        border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
  .pf-foto{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--panel2);flex:none}
  .pf-foto.ph{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--muted)}
  .pf-id{flex:1;min-width:220px}
  .pf-id h2{margin:0 0 4px;font-size:20px}
  .pf-meta{color:var(--muted);font-size:13px;line-height:1.7}
  .pf-meta b{color:var(--text)}
  .pf-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel2);
        border:1px solid var(--line);color:var(--muted)}
  .badge b{color:var(--text)}
  .badge.hl{border-color:var(--good);color:var(--good)}
  .badge.hl b{color:var(--good)}
  .pf-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .pf-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .pf-card .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .pf-card .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .pf-splitbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px}
  .pf-splitbar div{height:100%}
  .pf h3{margin:22px 0 10px;font-size:15px}
  .pf h3 small{color:var(--muted);font-weight:400;font-size:12px}
  .cat-j{color:#FFC22D}.cat-e{color:#00B3F0}
  .pf-empty{color:var(--muted);font-size:13px;padding:8px 0}
  .tscroll{overflow-x:auto}             /* breite Profil-Tabellen scrollen auf schmalen Screens intern */
  .pm-pos{color:var(--good)}.pm-neg{color:#FF6F70}
  .res{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;
       font-size:11px;font-weight:700;margin-left:7px;vertical-align:1px}
  .res-S{background:#12352E;color:var(--good)}
  .res-N{background:#3D1F26;color:#FF6F70}
  .res-U{background:var(--panel2);color:var(--muted)}
  .bench{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
        padding:10px 14px;margin-top:12px;overflow-x:auto}
  .bench table{font-size:12px;border-collapse:collapse;width:auto;min-width:340px}
  .bench td{padding:3px 12px 3px 0;border:none;vertical-align:middle}
  .bench .barbg{width:110px}
  .bench .lab{color:var(--muted)}
  .bench .lab.good{color:var(--good)}
  .bench .expl{font-size:11px;color:var(--muted);margin-top:7px}
  /* Schmale Bildschirme: Rating-Zeilen ohne Erklaerungsspalte, kuerzerer Balken -> kein horizontaler Scroll */
  @media(max-width:600px){.bench table{min-width:0;width:100%}.bench td{padding-right:8px}
    .bench td:nth-child(6){display:none}.bench .barbg{width:56px}}
  .pf-card .sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
  .pf-card .sub b{color:var(--text)}
  .copybtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;
        padding:3px 9px;font-size:12px;cursor:pointer;vertical-align:2px;white-space:nowrap}
  .copybtn:hover{border-color:var(--accent2);color:var(--text)}
  .copybtn.big{padding:8px 14px;font-size:13px;flex:none;align-self:flex-start;margin-left:auto}
  .symtab{font-size:13px;border-collapse:collapse;margin:8px 0}
  .symtab td{padding:3px 12px 3px 0;border:none;vertical-align:top}
  .symtab td:first-child{font-family:"Cambria Math",Georgia,serif;color:var(--text);white-space:nowrap}
  @media(max-width:760px){.step{grid-template-columns:1fr}.step .n{margin-bottom:-10px}}
  /* ---- Laden / Fehler / Nachladen beim Scrollen ---- */
  .empty .err{color:#FF6F70}
  /* ---- Virtuelle Tabelle (Scouting/Statistik/Matches): feste Zeilenhoehe (nowrap + Ellipsis,
     voller Text im title), zwei Spacer-Zeilen halten die Scrollhoehe ---- */
  .vt{table-layout:fixed}
  .vt>thead th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 6px}
  .vt>tbody>tr>td{height:36px;padding:0 6px;line-height:36px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;vertical-align:middle}
  .vt>tbody>tr.sp>td{height:0;padding:0;border:0;line-height:0}
  .vt>tbody>tr.sp:hover{background:none}
  .vt>tbody>tr>td.dt{height:auto;padding:8px 10px;line-height:1.5;white-space:normal;overflow:visible}
  .vt>tbody>tr>td.none{color:var(--muted);text-align:center;height:60px;line-height:60px}
  /* Scouting: Textzellen (Nat./Verein/Bewerb) duerfen auf 2 Zeilen umbrechen (feste Zeilenhoehe 46 px,
     Rest per Ellipsis + voller Text im title); so sind Verein(e) und Bewerb(e) wie im alten Dashboard
     lesbar, ohne dass die virtuelle Tabelle variable Zeilenhoehen braucht. */
  .vt.r2>tbody>tr>td{height:46px;line-height:17px;vertical-align:middle;padding:0 5px}
  .vt.r2>thead th{padding:8px 5px}
  .vt>thead th[title]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
  .vt.r2>tbody>tr.sp>td{height:0;line-height:0}
  .c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;
      hyphens:auto;overflow-wrap:anywhere;max-height:34px}
  .c2 .tag{display:inline;line-height:17px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  /* Erste Spalte (Name) klebt links, damit die Zeile beim horizontalen Scrollen (schmale Fenster) zuordenbar bleibt */
  .vt.stick1>thead th:first-child{position:sticky;left:0;z-index:3}
  .vt.stick1>tbody>tr>td:first-child{position:sticky;left:0;z-index:1;background:var(--bg);box-shadow:1px 0 0 var(--line)}
  .vt.stick1>tbody>tr:hover>td:first-child{background:var(--panel)}
  .vt.stick1>tbody>tr.sp>td:first-child{position:static}
  .pf-load{color:var(--muted);padding:30px 0;text-align:center}
  .pill.err{color:#FF6F70;border-color:#FF6F70}
  /* ================= Nova-Stil (Strykerlabs): Inter, dunkler Grund, Gruen nur als Akzent ================= */
  header{padding:12px 24px;gap:12px;background:var(--bg);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:6px}
  header h1 small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .mark{height:22px;width:auto;fill:var(--accent);flex:none}
  .pill{font-size:11px;padding:3px 10px;border-radius:6px;background:transparent;border:1px solid var(--line);
        font-variant-numeric:tabular-nums}
  .pill.on{color:var(--text);border-color:var(--line)}
  .pill.on b{color:var(--accent);font-weight:600}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--muted);padding:5px 10px;font:600 11px var(--font);letter-spacing:.06em;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.active{background:var(--panel2);color:var(--accent)}
  .seg button:hover{color:var(--text)}
  nav{padding:0 24px;background:var(--bg);gap:2px}
  nav button{font:500 13px var(--font);padding:12px 14px;border-bottom:2px solid transparent}
  nav button:hover{color:var(--text)}
  nav button.active{color:var(--text);border-bottom-color:var(--accent)}
  main{padding:20px}
  button,input,select{font-family:var(--font)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=search]:focus,select:focus,.fctl:focus,.ms-search:focus{border-color:var(--accent)}
  .sidebar{border-radius:12px;background:var(--panel);border-color:var(--line);padding:16px 14px}
  .sb-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .flabel{font-size:10.5px;font-weight:600;letter-spacing:.08em}
  .fctl,.ms-btn{border-radius:8px;background:var(--bg);border-color:var(--line)}
  .ms-btn:hover,.fbtn:hover,.copybtn:hover{border-color:var(--accent);color:var(--text)}
  .ms-pop{background:var(--bg);border-color:var(--line2)}
  .ms-opt:hover{background:var(--panel2)}
  .fbtn,.copybtn{border-radius:8px;background:transparent;border-color:var(--line);font-weight:500}
  .fbtn.primary{border-color:var(--accent);color:var(--accent)}
  .chip{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:3px 4px 3px 9px}
  .tblscroll{border-radius:12px;border-color:var(--line);background:var(--panel)}
  .tblscroll thead th,.vt>thead th{background:var(--panel);font-size:11.5px;font-weight:600;letter-spacing:.01em;
        color:var(--muted);border-bottom:1px solid var(--line2)}
  th,td{border-bottom-color:var(--line)}
  tbody tr:hover{background:var(--panel2)}
  .vt.stick1>tbody>tr>td:first-child{background:var(--panel)}

<script>

/* Datenvertrag: DASHBOARD-DATA.md. Beim Start wird nur data/scout.json geladen
   (1 Zeile je Spieler); Matches-Index, Profile und Spiel-Details kommen lazy. */

/* ---------- Sprache (DE/EN): ?lang= > localStorage > Browsersprache ---------- */

    const st=localStorage.getItem("oefb-lang"); if(st==="de"||st==="en")return st; }catch(e){}

/* TX(de,en): Text in der aktiven Sprache (nicht L: so heisst in den Grafik-Funktionen der linke Rand). Uebersetzungen stehen direkt neben dem deutschen Original. */

/* Laendernamen kommen deutsch aus dem OeFB-Profil; fuer EN die haeufigsten uebersetzt (Rest bleibt deutsch) */
const NAT_EN={"Österreich":"Austria","Kroatien":"Croatia","Slowenien":"Slovenia","Deutschland":"Germany","Ungarn":"Hungary",
  "Bosnien und Herzegowina":"Bosnia and Herzegovina","Serbien":"Serbia","Slowakei":"Slovakia","Türkei":"Türkiye","Rumänien":"Romania",
  "Italien":"Italy","Nordmazedonien":"North Macedonia","Polen":"Poland","Syrien":"Syria","Tschechien":"Czechia","Frankreich":"France",
  "Brasilien":"Brazil","Schweiz":"Switzerland","Bulgarien":"Bulgaria","Spanien":"Spain","Niederlande":"Netherlands","Russland":"Russia",
  "Vereinigte Staaten":"United States","Irak":"Iraq","Griechenland":"Greece","Georgien":"Georgia","Schweden":"Sweden","Kamerun":"Cameroon",
  "Kongo-Brazzaville":"Congo-Brazzaville","Kongo-Kinshasa":"Congo-Kinshasa","Albanien":"Albania","Luxemburg":"Luxembourg","Litauen":"Lithuania",
  "Südkorea":"South Korea","Belgien":"Belgium","Staatenlos":"Stateless","Ägypten":"Egypt","Tunesien":"Tunisia","Kanada":"Canada",
  "Armenien":"Armenia","Kolumbien":"Colombia","Irland":"Ireland","Kenia":"Kenya","Mongolei":"Mongolia","Australien":"Australia",
  "Marokko":"Morocco","Zypern":"Cyprus","Argentinien":"Argentina","Dänemark":"Denmark","Norwegen":"Norway","Finnland":"Finland",
  "Lettland":"Latvia","Estland":"Estonia","Moldau":"Moldova","Aserbaidschan":"Azerbaijan","Kasachstan":"Kazakhstan","Algerien":"Algeria",
  "Äthiopien":"Ethiopia","Südafrika":"South Africa","Mexiko":"Mexico","Indien":"India","Philippinen":"Philippines","Libanon":"Lebanon",
  "Elfenbeinküste":"Côte d’Ivoire","Kap Verde":"Cape Verde","Dominikanische Republik":"Dominican Republic","Island":"Iceland",
  "Wales":"Wales","Schottland":"Scotland","Nordirland":"Northern Ireland","Jordanien":"Jordan","Libyen":"Libya","Sudan":"Sudan",
  "Eritrea":"Eritrea","Kuba":"Cuba","Thailand":"Thailand","Vietnam":"Vietnam","Pakistan":"Pakistan","Tschad":"Chad","Uganda":"Uganda"};
const natLabel=v=>LANG==="en"?(NAT_EN[v]||v||""):(v||"");
const roleLabel=v=>v==="starter"?TX("Startelf","Starter"):v==="bench"?TX("Bank","Bench"):(v||"");
const resLabel=r=>LANG==="en"?({S:"W",U:"D",N:"L"}[r]||r):r;
const nf=n=>Number(n).toLocaleString(LOC());

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){
  if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else e.setAttribute(k,a[k]);}
  for(const c of kids)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const esc = s => (s==null?"":String(s));
/* HTML-Escape fuer innerHTML-Kontexte (Fehlertexte, Profil-Metadaten aus der API) */
const hesc = s => esc(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => esc(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const leagueCat=c=>/\bU\s?\d|jugend/i.test(c||"")?"Jugend":"Erwachsen";
const truthy=v=>v===true||v==="True"||v==="true"||v==="1"||v==="X"||v==="x";
/* fmtRat: Rating-Zahl mit Vorzeichen/3 Nachkommastellen; "—" wenn leer */
const fmtRat=v=>(v===""||v==null||isNaN(+v))?"—":((+v>=0?"+":"")+(+v).toFixed(3));
function fmtPM(v,dec=0){const n=+v;return (n>0?"+":"")+n.toFixed(dec);}
function pmClass(v){return +v>0?"pm-pos":(+v<0?"pm-neg":"");}
function pctLabel(p){ const i=p<=5?0:p<=20?1:p<=40?2:p<=60?3:p<=80?4:5;
  return TX(["herausragend","stark","überdurchschnittlich","durchschnittlich","unterdurchschnittlich","schwach"],
           ["outstanding","strong","above average","average","below average","weak"])[i]; }
const safe=fn=>{try{fn();}catch(e){console.error(e);}};
/* Messwerte (Boot, Filter, Profil) in #perf ablegen – fuer Tests per --dump-dom lesbar */
function setPerf(k,ms){ state.perf[k]=Math.round(ms*10)/10; const p=$("#perf");
  if(p){p.dataset[k]=state.perf[k]; p.textContent=JSON.stringify(state.perf);} }
/* Zeitstempel "2026-11-03T01:52:10" -> "03.11.2026, 01:52" */
function fmtBuilt(s){ const d=new Date(s); if(isNaN(d))return esc(s);
  return d.toLocaleString(LOC(),{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }

/* Text in die Zwischenablage kopieren; kurzes Erfolgs-Feedback am Button */
function copyText(txt,btn){
  const done=()=>{ if(!btn)return; const old=btn.textContent; btn.textContent=TX("✓ kopiert","✓ copied");
    setTimeout(()=>{btn.textContent=old;},1500); };
  const fallback=()=>{ try{
      const ta=document.createElement("textarea"); ta.value=txt;
      ta.style.position="fixed"; ta.style.opacity="0";
      (document.body||document.documentElement).appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }catch(e){} done(); };
  if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,fallback);
  else fallback();
}

/* ---------- Laden: EIN Helfer fuer alle fetches (einfache URLs; der Server
   liefert ETag + no-cache, der Browser fragt nach und bekommt 304) ---------- */
async function fetchJSON(url){
  let r;
  try{ r=await fetch(url); }
  catch(e){ throw new Error(location.protocol==="file:"
    ?TX("Das Dashboard braucht den Datenserver (./serve_local.sh) – per file:// können keine Daten geladen werden.",
       "The dashboard needs the data server (./serve_local.sh) – no data can be loaded via file://.")
    :TX(`Server nicht erreichbar (${url})`,`Server not reachable (${url})`)); }
  if(!r.ok){
    let detail=""; try{const j=await r.json(); detail=j.detail||"";}catch(e){}
    const err=new Error(`HTTP ${r.status}${detail?" – "+detail:""} (${url})`); err.status=r.status; throw err;
  }
  return r.json();
}
/* Leer-/Lade-/Fehlerzustand eines Tabs. kind: loading | error | empty */
function emptyMsg(kind,html,retry){
  const icon=kind==="loading"?"…":kind==="error"?"!":"–";
  const box=el("div",{class:"empty"},el("div",{style:"font-size:26px;margin-bottom:8px;color:var(--accent);font-weight:600"},icon),
    el("div",{class:kind==="error"?"err":"",html:html}));
  if(retry){const b=el("button",{class:"fbtn",style:"margin-top:12px"},TX("Erneut versuchen","Try again")); b.onclick=retry; box.append(b);}
  return box;
}

/* Eigene Tooltips fuer [data-tip] (Spaltenkoepfe): sofort sichtbar, Titelzeile aus data-tip-title */
(function(){ const tip=$("#tip"); if(!tip)return; let cur=null;
  const show=t=>{ if(!t.getBoundingClientRect().width)return;      // Element in verstecktem Tab
    cur=t; tip.innerHTML=""; if(t.dataset.tipTitle)tip.append(el("b",{},t.dataset.tipTitle)); tip.append(t.dataset.tip);
    tip.classList.add("on"); const r=t.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    let y=r.bottom+8; if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
    tip.style.left=Math.min(innerWidth-w-8,Math.max(8,r.left+r.width/2-w/2))+"px"; tip.style.top=y+"px"; };
  const hide=()=>{ if(cur){cur=null; tip.classList.remove("on");} };
  document.addEventListener("mouseover",e=>{ const t=e.target.closest?e.target.closest("[data-tip]"):null;
    if(t){ if(t!==cur)show(t); } else hide(); });
  document.addEventListener("focusin",e=>{ const t=e.target.closest?e.target.closest("[data-tip]"):null; if(t)show(t); else hide(); });
  document.addEventListener("scroll",hide,true); document.addEventListener("mousedown",hide,true);
  window.addEventListener("hashchange",hide); document.addEventListener("mouseleave",hide);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape")hide(); }); })();
/* CSV-Export der aktuell gefilterten Liste (DE: Semikolon + Dezimalkomma fuer Excel; EN: Komma + Punkt) */
function downloadCSV(name,header,rows){
  const sep=TX(";",","), q=v=>{ v=v==null?"":String(v); return (v.includes('"')||v.includes(sep)||/[\r\n]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v; };
  const txt="\ufeff"+[header,...rows].map(r=>r.map(q).join(sep)).join("\r\n");
  const a=el("a",{href:URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"})),download:name});
  document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
const csvNum=v=>v==null||v===""?"":(LANG==="de"?String(v).replace(".",","):String(v));
/* "/" springt ins Suchfeld des sichtbaren Tabs */
document.addEventListener("keydown",e=>{ if(e.key!=="/"||e.metaKey||e.ctrlKey||e.altKey)return;
  const a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  const sec=[...document.querySelectorAll("main>section")].find(x=>!x.hidden); const inp=sec&&sec.querySelector("input[type=search]");
  if(inp){ e.preventDefault(); const sb=inp.closest(".sidebar"); if(sb)sb.classList.remove("collapsed"); inp.focus(); inp.select(); } });

/* Header-Hoehe (bricht auf schmalen Screens um) als CSS-Variable: nav und Sidebar kleben darunter */
(function(){ const hdr=document.querySelector("header"); if(!hdr)return;
  const set=()=>document.documentElement.style.setProperty("--hdrh",hdr.offsetHeight+"px");
  set(); if(typeof ResizeObserver!=="undefined")new ResizeObserver(set).observe(hdr); else window.addEventListener("resize",set); })();

/* ---------- tabs + URL-Hash (#scout, #profile=<id>, #stats, #explain, #matches) ---------- */
const TABS=["scout","profile","stats","explain","matches"];
const onShow={};                    // tab -> Callback nach dem Einblenden (virtuelle Tabelle neu messen/layouten)
function switchTab(tab){
  if(!TABS.includes(tab))tab="scout";
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  for(const t of TABS) $("#tab-"+t).hidden = (t!==tab);
  if(tab==="matches")loadMatches();
  setHash(tab==="profile"&&state.profileId?"profile="+state.profileId:tab);
  if(onShow[tab])onShow[tab]();
}
function setHash(h){ if(location.hash!=="#"+h) history.replaceState(null,"","#"+h); }
function route(){
  let h=location.hash.replace(/^#/,""); try{h=decodeURIComponent(h);}catch(e){}   // kaputtes %-Encoding ignorieren
  const m=/^profile=(\d+)$/.exec(h);
  if(m){ openProfile(m[1]); return; }
  switchTab(h||"scout");
}
window.addEventListener("hashchange",route);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

/* ---------- generic filter framework ---------- */
function uniqueVals(rows,get){
  const s=new Set();
  rows.forEach(r=>{const v=get(r); if(v!=null&&v!=="")s.add(v);});
  return [...s].sort((a,b)=>{const na=+a,nb=+b;
    return (!isNaN(na)&&!isNaN(nb))?na-nb:String(a).localeCompare(String(b),"de");});
}
const emptyVal=v=>v==null||v===""||
  (Array.isArray(v)&&(v.length===0||(v.length===2&&v[0]===""&&v[1]==="")));
/* Filter -> EINMAL kompiliertes Praedikat; in der heissen Schleife kein norm()/Regex je Zeile
   (Text sucht in vorberechneten, normalisierten Feldern; fehlende Zahlen (null) fallen raus) */
function compilePred(def,v){
  if(def.pred)return def.pred(v);
  const g=def.get;
  if(def.type==="text"){const q=norm(v), ng=def.nget||(r=>norm(g(r))); return r=>ng(r).includes(q);}
  if(def.type==="select"){const s=new Set((Array.isArray(v)?v:[v]).map(String)); return r=>s.has(String(g(r)));}
  if(def.type==="bool"){const want=v==="ja"; return r=>truthy(g(r))===want;}
  if(def.type==="range"){const lo=v[0]===""?-Infinity:+v[0], hi=v[1]===""?Infinity:+v[1];
    return r=>{const n=g(r); return n!=null&&n===n&&n>=lo&&n<=hi;};}
  return ()=>true;
}
function chipText(def,v){
  const f=def.format||(x=>x), dp=def.disp||(x=>x);
  if(def.type==="range")return `${def.label} ${v[0]!==""?"≥"+f(v[0]):""}${v[0]!==""&&v[1]!==""?" ":""}${v[1]!==""?"≤"+f(v[1]):""}`;
  if(def.type==="bool")return `${def.label}: ${v==="ja"?TX("ja","yes"):TX("nein","no")}`;
  if(def.type==="text")return `„${v}"`;
  if(def.type==="select"){const a=Array.isArray(v)?v:[v];
    return `${def.label}: ${a.length>2?a.length+TX(" gewählt"," selected"):a.map(dp).join(", ")}`;}
  return `${def.label}: ${v}`;
}
/* Multiselect-Dropdown (Checkboxen, optional mit Suche); disp = Anzeige-Label je Option (Wert bleibt unveraendert) */
function multiSelectControl(options,onChange,disp){
  const dp=disp||(x=>x);
  const sel=new Set();
  const wrap=el("div",{class:"ms"});
  const btn=el("button",{class:"ms-btn",type:"button"},TX("alle","all"),el("span",{class:"ms-caret"},"▾"));
  const pop=el("div",{class:"ms-pop"});
  const search=options.length>8?el("input",{class:"ms-search",type:"search",placeholder:TX("filtern…","filter…")}):null;
  const list=el("div",{class:"ms-list"});
  if(search)pop.append(search); pop.append(list); wrap.append(btn,pop);
  const label=()=>{btn.firstChild.nodeValue=sel.size?(sel.size===1?String(dp([...sel][0])):sel.size+TX(" gewählt"," selected")):TX("alle","all");};
  function renderList(){
    const q=search?norm(search.value):""; list.innerHTML="";
    options.filter(o=>!q||norm(dp(o)).includes(q)).forEach(o=>{
      const row=el("label",{class:"ms-opt"});
      const cb=el("input",{type:"checkbox"}); cb.checked=sel.has(o);
      cb.onchange=()=>{cb.checked?sel.add(o):sel.delete(o); label(); onChange([...sel]);};
      row.append(cb,document.createTextNode(dp(o))); list.append(row);
    });
  }
  if(search)search.oninput=renderList;
  btn.onclick=()=>{const o=pop.classList.toggle("open"); if(o)renderList();};   // Liste erst beim Oeffnen bauen (lazy)
  return {element:wrap,clear:()=>{sel.clear();label();if(pop.classList.contains("open"))renderList();}};
}
/* Sidebar-Filter: Range = Histogramm-Slider. Texteingaben sind entprellt (120 ms); onChange wird vom Aufrufer
   per rAF gebuendelt. defs duerfen {type:"section",key,label} enthalten: alle folgenden Filter landen in einer
   auf-/zuklappbaren Gruppe (Zustand je Gruppe in localStorage, Zaehler aktiver Filter im Gruppenkopf).
   Unter 880 px ist die ganze Filterleiste eingeklappt und per Button aufklappbar. */
function makeFilterBar(host,rows,defs,onChange){
  const f={};                       // key -> {def,v}
  const ctl={};                     // key -> clear()
  const count=el("span",{class:"count"});
  const reset=el("button",{class:"fbtn"},"Reset");
  const toggle=el("button",{class:"fbtn sb-toggle",type:"button"},TX("Filter anzeigen","Show filters"));
  const head=el("div",{class:"sb-head"},el("span",{class:"sb-title"},"Filter"),el("span",{style:"display:flex;gap:6px"},toggle,reset));
  const chips=el("div",{class:"chips"});
  const fields=el("div",{class:"sb-fields"});
  host.append(head,chips,fields);
  host.classList.add("collapsed");                       // wirkt nur unter 880 px (CSS)
  toggle.onclick=()=>{ const c=host.classList.toggle("collapsed"); toggle.textContent=c?TX("Filter anzeigen","Show filters"):TX("Filter ausblenden","Hide filters"); };

  const set=(def,v)=>{ if(emptyVal(v))delete f[def.key]; else f[def.key]={def,v}; refresh(); };
  let target=fields; const groups=[];                    // {keys:Set,badge}
  const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

  defs.forEach(def=>{
    if(def.type==="section"){
      const badge=el("span",{class:"n"});
      const det=el("details",{class:"fgrp"}); det.open=lsGet("oefb-fg-"+def.key)!=="0";
      det.append(el("summary",{},el("span",{},def.label,badge)));
      det.addEventListener("toggle",()=>lsSet("oefb-fg-"+def.key,det.open?"1":"0"));
      const body=el("div",{class:"fg-body"}); det.append(body); fields.append(det);
      target=body; groups.push({keys:new Set(),badge}); return;
    }
    if(groups.length)groups[groups.length-1].keys.add(def.key);
    const field=el("div",{class:"field"});
    field.append(el("span",{class:"flabel"},def.label));
    let inp;
    if(def.type==="text"){
      inp=el("input",{type:"search",class:"fctl",placeholder:def.placeholder||TX("suchen…","search…")});
      let tmr=null;
      inp.oninput=()=>{clearTimeout(tmr); tmr=setTimeout(()=>set(def,inp.value),120);};
      ctl[def.key]=()=>inp.value="";
    } else if(def.type==="select"){
      const opts=def.options||uniqueVals(rows,def.get);
      const ms=multiSelectControl(opts,arr=>set(def,arr),def.disp);
      inp=ms.element; ctl[def.key]=()=>ms.clear();
    } else if(def.type==="bool"){
      inp=el("select",{class:"fctl"});
      [["",TX("alle","all")],["ja",TX("ja","yes")],["nein",TX("nein","no")]].forEach(([v,t])=>inp.append(el("option",{value:v},t)));
      inp.onchange=()=>set(def,inp.value); ctl[def.key]=()=>inp.selectedIndex=0;
    } else if(def.type==="range"){
      const vals=[]; for(const r of rows){const v=def.get(r); if(v==null)continue; const n=+v; if(isNaN(n))continue;
        if(def.min!=null&&n<def.min)continue; if(def.max!=null&&n>def.max)continue; vals.push(n);}  // unsinnige Kleinstwerte ausblenden
      const hr=HistogramRange({values:vals,step:def.step||1,format:def.format,
        scale:def.scale||"linear",histo:def.histo!==false,min:def.min,max:def.max,
        inputs:true,onChange:r=>set(def,r)});
      ctl[def.key]=()=>hr.reset();
      inp=hr.element;
      field.append(inp);
      if(def.presets){                          // Schnellauswahl-Buttons (z.B. Top 20%)
        const pr=el("div",{class:"presets"});
        def.presets.forEach(([lab,rng])=>{
          const b=el("button",{class:"fbtn preset",type:"button"},lab);
          b.onclick=()=>{hr.setRange(rng[0]===""?null:rng[0],rng[1]===""?null:rng[1]);set(def,rng);};
          pr.append(b);
        });
        field.append(pr);
      }
      target.append(field); return;
    }
    field.append(inp); target.append(field);
  });

  reset.onclick=()=>{Object.keys(f).forEach(k=>delete f[k]);Object.values(ctl).forEach(c=>c());refresh();};

  function refresh(){
    chips.innerHTML="";
    Object.entries(f).forEach(([k,{def,v}])=>{
      const chip=el("span",{class:"chip"},chipText(def,v),el("span",{class:"x"},"×"));
      chip.querySelector(".x").onclick=()=>{delete f[k]; ctl[k]&&ctl[k](); refresh();};
      chips.append(chip);
    });
    groups.forEach(g=>{ let n=0; for(const k of g.keys)if(f[k])n++; g.badge.textContent=n?" · "+n:""; });
    const na=Object.keys(f).length; reset.classList.toggle("primary",na>0);
    onChange();
  }
  /* apply: liefert immer ein NEUES Array (Aufrufer sortiert in-place) */
  const apply=data=>{
    const preds=Object.values(f).map(({def,v})=>compilePred(def,v));
    if(!preds.length)return data.slice();
    const out=[];
    for(let i=0;i<data.length;i++){const r=data[i]; let ok=true;
      for(let j=0;j<preds.length;j++)if(!preds[j](r)){ok=false;break;}
      if(ok)out.push(r);}
    return out;
  };
  return {apply,count,active:()=>Object.keys(f).length};
}

/* ---------- Virtuelle Tabelle ----------
   Nur die sichtbaren Zeilen (+ BUF Puffer oben/unten) stehen im DOM; zwei Spacer-Zeilen halten die
   Scrollhoehe, damit Scrollbalken, End-Taste und Sprung ans Listenende direkt funktionieren.
   Zeilenhoehe wird einmal gemessen (CSS .vt: nowrap + Ellipsis, voller Text im title). Neu gerendert
   wird per requestAnimationFrame, sobald der halbe Puffer aufgebraucht ist. setRows() springt an den
   Anfang (Filter/Sortierung). Optional eine aufgeklappte Detailzeile mit gemessener Hoehe (Matches).
   Spaltenbreiten (table-layout:fixed): w = feste Pixel; flex = Gewicht fuer den Rest der Containerbreite,
   min = Untergrenze dafuer. Passt die Summe nicht in den Container, scrollt .tblscroll horizontal. */
function VirtualTable(wrap,opts){
  const BUF=20, MAXVIS=80;   // MAXVIS: Obergrenze fuer das sichtbare Fenster – auch ein Container ohne Hoehenbegrenzung
                             // (max-height:none) bekommt nie alle Zeilen ins DOM, sondern hoechstens MAXVIS+2*BUF
  const table=el("table",{class:"vt"+(opts.tableClass?" "+opts.tableClass:"")}),colg=el("colgroup"),thead=el("thead"),tb=el("tbody");
  table.append(colg,thead,tb); wrap.innerHTML=""; wrap.append(table);
  const topSp=el("tr",{class:"sp"},el("td")), botSp=el("tr",{class:"sp"},el("td"));
  let rows=[],rowH=36,measured=false,start=0,end=0,open=null,openH=0,detail=null,ncols=1,raf=0,colDefs=[],lastW=-1,regrow=false;
  const visCount=()=>Math.min(MAXVIS,Math.ceil((wrap.clientHeight||600)/rowH)+1);
  function layout(force){                          // Spaltenbreiten an die Containerbreite anpassen
    const cw=wrap.clientWidth; if(!cw||(!force&&cw===lastW))return; lastW=cw;
    let fixed=0,fw=0; colDefs.forEach(c=>{ if(c.flex)fw+=c.flex; else fixed+=c.w||80; });
    let pool=Math.max(0,cw-fixed-1); const atMin=new Map();   // flex-Spalten unter ihrer Mindestbreite: auf min
    for(let pass=0,changed=true;changed&&pass<colDefs.length;pass++){ changed=false;   // festnageln, Rest neu verteilen
      colDefs.forEach(c=>{ if(!c.flex||atMin.has(c))return; const m=c.min||80;
        if(Math.floor(pool*c.flex/fw)<m){atMin.set(c,m); pool-=m; fw-=c.flex; changed=true;} }); }
    colDefs.forEach((c,i)=>{ const w=c.flex?(atMin.get(c)||Math.floor(Math.max(0,pool)*c.flex/fw)):(c.w||80);
      colg.children[i].style.width=w+"px"; });
  }
  function setCols(cols){
    colDefs=cols; ncols=cols.length; colg.innerHTML=""; thead.innerHTML=""; const tr=el("tr");
    cols.forEach(c=>{colg.append(el("col"));
      const th=el("th",{},el("span",{class:"lbl"},c.l)); if(c.t){th.dataset.tip=c.t; th.dataset.tipTitle=c.tl||c.l; th.tabIndex=0;}
      if(opts.onSort&&c.sortable!==false)th.onclick=()=>opts.onSort(c); tr.append(th);});
    thead.append(tr); topSp.firstChild.colSpan=botSp.firstChild.colSpan=ncols; layout(true); markSort();
  }
  function markSort(){                              // Pfeil an der sortierten Spalte (opts.sortState() -> {k,dir})
    if(!opts.sortState)return; const st=opts.sortState();
    [...thead.querySelectorAll("th")].forEach((th,i)=>{ const c=colDefs[i], on=!!(c&&st&&c.k===st.k);
      th.classList.toggle("sorted",on); th.setAttribute("aria-sort",on?(st.dir>0?"ascending":"descending"):"none");
      let a=th.querySelector(".arr");
      if(on){ if(!a){a=el("span",{class:"arr"}); th.append(a);} a.textContent=st.dir>0?"▲":"▼"; } else if(a)a.remove(); });
  }
  function setRows(r,openIdx,detailEl){ rows=r; open=openIdx==null||openIdx<0?null:openIdx; detail=detailEl||null; openH=0;
    wrap.scrollTop=0; markSort(); render(0); }
  function setOpen(openIdx,detailEl){ open=openIdx==null||openIdx<0?null:openIdx; detail=detailEl||null; openH=0; render(start); }
  function visibleStart(){
    const st=wrap.scrollTop;
    let s=Math.floor(st/rowH);
    if(open!=null&&st>(open+1)*rowH){ s=Math.floor((st-openH)/rowH); if(s<=open)s=open; }
    return Math.max(0,Math.min(s,rows.length));
  }
  function render(s){
    layout(false);                                 // Containerbreite geaendert (Resize, Tab eingeblendet)?
    const n=rows.length, vh=wrap.clientHeight||600, vis=visCount();
    start=Math.max(0,s-BUF); end=Math.min(n,s+vis+BUF);
    tb.innerHTML="";
    const frag=document.createDocumentFragment();
    topSp.firstChild.style.height=(start*rowH+(open!=null&&open<start?openH:0))+"px"; frag.append(topSp);
    if(!n&&opts.emptyText)frag.append(el("tr",{class:"sp"},el("td",{class:"none",colspan:String(ncols)},opts.emptyText)));
    for(let i=start;i<end;i++){ frag.append(opts.renderRow(rows[i],i)); if(i===open&&detail)frag.append(detail); }
    botSp.firstChild.style.height=Math.max(0,(n-end)*rowH)+"px"; frag.append(botSp);
    tb.append(frag);
    if(end<n&&vis<MAXVIS&&!regrow&&wrap.clientHeight>vh+rowH){   // Container ist mitgewachsen (z. B. nach leerem Ergebnis):
      regrow=true; try{render(s);}finally{regrow=false;} return; }    // Fenster genau einmal nachziehen (kein Wachstums-Loop)
    if(open!=null&&detail&&open>=start&&open<end)openH=detail.getBoundingClientRect().height;
    if(!measured&&end>start){ const tr=topSp.nextElementSibling;   // Zeilenhoehe einmal messen (nicht im versteckten Tab)
      const h=tr?tr.getBoundingClientRect().height:0;
      if(h>10){measured=true; if(Math.abs(h-rowH)>0.5){rowH=h; render(s); return;}} }
  }
  function check(){
    const s=visibleStart(), vis=visCount(), e=Math.min(rows.length,s+vis);
    if(s<start+BUF/2&&start>0 || e>end-BUF/2&&end<rows.length) render(s);
    else if(open!=null&&detail&&open>=start&&open<end){const h=detail.getBoundingClientRect().height; if(Math.abs(h-openH)>1){openH=h;render(s);}}
  }
  wrap.addEventListener("scroll",()=>{ if(!raf)raf=requestAnimationFrame(()=>{raf=0;check();}); },{passive:true});
  window.addEventListener("resize",()=>{ if(!wrap.isConnected)return; if(!raf)raf=requestAnimationFrame(()=>{raf=0;render(visibleStart());}); });
  return {setCols,setRows,setOpen,relayout:()=>render(visibleStart()),get rows(){return rows;}};
}
/* rAF-gebuendeltes Neuzeichnen (mehrere Filteraenderungen -> ein draw) */
function coalesce(fn){ let raf=0; return ()=>{ if(raf)return; raf=requestAnimationFrame(()=>{raf=0;fn();}); }; }

/* ---------- scout.json -> Zeilenobjekte (einmal beim Start) ---------- */
/* Aktuelle Saison = letzte in scout.json "seasons" (z. B. "2026/27"); Kurzform "26/27" fuer Spaltenkopf/Filter */
const curSeason=d=>(d&&d.seasons&&d.seasons.length)?d.seasons[d.seasons.length-1]:"";
const shortSeason=s=>String(s).replace(/^(\d\d)(\d\d)\/(\d\d)$/,"$2/$3");
function decodeScout(d){
  const teams=d.teams, comps=d.competitions, nteams=teams.map(norm), ncomps=comps.map(norm);
  const seasons=d.seasons||[], cur=seasons.length-1;
  const C=Object.fromEntries(d.cols.map((c,i)=>[c,i]));
  const out=new Array(d.rows.length);
  for(let i=0;i<d.rows.length;i++){
    const r=d.rows[i], ti=r[C.teams]||[], ci=r[C.comps]||[], se=(C.sea!=null&&r[C.sea])||[];
    const teamsArr=ti.map(j=>teams[j]), compsArr=ci.map(j=>comps[j]);
    const team=teamsArr.join(", "), comp=compsArr.join(", "), name=esc(r[C.name]);
    // se = [[Saison-Index, Minuten, Einsaetze], ...] aufsteigend; cmin/cmatches = laufende Saison (0 ohne Einsatz)
    let cmin=0,cmatches=0; for(const x of se){ if(x[0]===cur){cmin=x[1]||0;cmatches=x[2]||0;} }
    out[i]={id:r[C.id]||"",name,teamsArr,compsArr,team,comp,by:r[C.by],age:r[C.age],
      pos:r[C.pos]||"",role:r[C.role]||"",nat:r[C.nat]||"",verband:r[C.verband]||"",cap:!!r[C.cap],
      min:r[C.min]||0,matches:r[C.matches]||0,goals:r[C.goals]||0,first:r[C.first],last:r[C.last],
      off:r[C.off],def:r[C.def],total:r[C.total],peak:r[C.peak],pct_talent:r[C.pct_talent],
      total_cur:C.total_cur!=null?r[C.total_cur]:null,   // zeitgewichtetes Total (scout.json v3), sonst null
      seasonsArr:se.map(x=>seasons[x[0]]),cmin,cmatches,talRank:null,talN:null,
      cat:leagueCat(comp),
      // normalisierte Felder fuer Textsuche + String-Sortierung (keine norm() je Zeile spaeter)
      nname:norm(name),nteam:ti.map(j=>nteams[j]).join(", "),ncomp:ci.map(j=>ncomps[j]).join(", "),
      nnat:norm(r[C.nat]),npos:norm(r[C.pos]),nrole:norm(r[C.role])};
  }
  // Talent-Rang je Jahrgang (fuer den Tooltip "Rang x von n"): pct_talent aufsteigend, gleiche Werte = gleicher Rang
  const byY=new Map();
  for(const p of out){ if(p.by!=null&&p.pct_talent!=null){ if(!byY.has(p.by))byY.set(p.by,[]); byY.get(p.by).push(p);} }
  for(const arr of byY.values()){
    arr.sort((a,b)=>a.pct_talent-b.pct_talent);
    let rank=0; for(let i=0;i<arr.length;i++){ if(i===0||arr[i].pct_talent!==arr[i-1].pct_talent)rank=i+1; arr[i].talRank=rank; arr[i].talN=arr.length; }
  }
  return out;
}

/* ---------- SPIELERPROFIL (Daten fertig aus /api/profile/{id}) ---------- */
/* SVG: +/- je Match + minutengewichteter Running Average (Fenster 5) */
function drawPMChart(host,games){
  const W=920,H=280,L=44,R=14,T=18,B=46,n=games.length;
  const xs=i=>n>1?L+i*(W-L-R)/(n-1):(L+(W-L-R)/2);
  const vals=games.map(g=>g.pm);
  let lo=Math.min(-1,...vals),hi=Math.max(1,...vals);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":TX("Plus-Minus-Verlauf","Plus-minus trend")});
  // y-Gitter
  for(let v=Math.ceil(lo);v<=Math.floor(hi);v++){
    s.append(sv("line",{x1:L,y1:Y(v),x2:W-R,y2:Y(v),stroke:v===0?"#353649":"#ffffff08",
      "stroke-width":v===0?1.5:1}));
    s.append(sv("text",{x:L-7,y:Y(v)+4,"text-anchor":"end",fill:"#8A93AD","font-size":10},fmtPM(v)));
  }
  // Saisongrenzen
  let lastSeason=null;
  games.forEach((g,i)=>{ if(g.season!==lastSeason){
    if(lastSeason!==null)s.append(sv("line",{x1:xs(i)-3,y1:T,x2:xs(i)-3,y2:H-B,stroke:"#785EF0","stroke-width":1,"stroke-dasharray":"3 4"}));
    s.append(sv("text",{x:xs(i),y:H-B+16,"text-anchor":"start",fill:"#785EF0","font-size":10},g.season));
    lastSeason=g.season; }});
  // Running Average (minutengewichtet, Fenster 5)
  const WIN=5,pts=[];
  for(let i=0;i<n;i++){
    let sw=0,sv2=0;
    for(let j=Math.max(0,i-WIN+1);j<=i;j++){sw+=games[j].min;sv2+=games[j].pm*games[j].min;}
    pts.push(`${xs(i)},${Y(sw?sv2/sw:0)}`);
  }
  s.append(sv("polyline",{points:pts.join(" "),fill:"none",stroke:"#34B190","stroke-width":2.2,"stroke-linejoin":"round"}));
  // Punkte je Match
  games.forEach((g,i)=>{
    const c=g.cat==="Jugend"?"#FFC22D":"#00B3F0";
    const dot=sv("circle",{cx:xs(i),cy:Y(g.pm),r:2.2+2.6*Math.min(1,g.min/90),
      fill:c,"fill-opacity":.35+.6*Math.min(1,g.min/90),stroke:c,"stroke-width":.8});
    dot.append(sv("title",{},`${g.date} ${g.ha==="H"?"vs":"@"} ${g.opp} (${g.sf}:${g.sg} ${resLabel(g.res)})\n${g.comp} · ${g.min}′ · +/- ${fmtPM(g.pm)}`));
    s.append(dot);
  });
  s.append(sv("text",{x:L,y:12,fill:"#8A93AD","font-size":10},TX("Tordifferenz während Einsatzzeit, je Spiel","Goal difference while on the pitch, per match")));
  host.append(s);
  host.append(el("div",{class:"legend"},
    el("span",{},el("span",{class:"sw",style:"background:#FFC22D"}),TX("Jugend-Bewerb","Youth competition")),
    el("span",{},el("span",{class:"sw",style:"background:#00B3F0"}),TX("Erwachsenen-Bewerb","Senior competition")),
    el("span",{},el("span",{class:"sw",style:"background:#34B190"}),TX("Running Average (5 Spiele, minutengewichtet)","Running average (5 matches, minute-weighted)")),
    el("span",{},TX("Punktgröße = Spielminuten","Dot size = minutes played"))));
}
/* SVG: kumuliertes +/- pro 90 des Spielers + mitlaufende Jahrgangs-Referenzlinien.
   `games` = Spiele mit pm!=null; cohort = {ok,th[],med[],pct} aus /api/profile
   (Top-20 %/Median je Spieltag, server-seitig berechnet). cat = Bewerbs-Kategorie der Referenz. */
function drawCumChart(host,games,birthYear,cat,cohort){
  const W=920,H=300,L=48,R=130,T=18,B=46,n=games.length,MINM=270;
  const xs=i=>n>1?L+i*(W-L-R)/(n-1):(L+(W-L-R)/2);
  // Spieler-Kumulation
  let cm=0,cp=0;
  const cum=games.map(g=>{cm+=g.min;cp+=g.pm;return {v:cm?cp/cm*90:0,min:cm};});
  // Kohorten-Linien (Top-20 % = 0.8-Quantil, Median) je Match-Datum – aus dem Profil
  const cohortOk=!!(cohort&&cohort.ok);
  const th=games.map((g,i)=>cohortOk&&cohort.th&&cohort.th[i]!=null?cohort.th[i]:null);
  const med=games.map((g,i)=>cohortOk&&cohort.med&&cohort.med[i]!=null?cohort.med[i]:null);
  // y-Bereich NUR aus dem stabilen Teil (>= MINM kumulierte Minuten) + Referenzen;
  // der verrauschte Anfang wird geclippt statt die Skala zu sprengen.
  const solidStart=cum.findIndex(c=>c.min>=MINM);
  const stable=(solidStart===-1?cum:cum.slice(solidStart)).map(c=>c.v);
  const all=[...(stable.length?stable:cum.map(c=>c.v)),
             ...th.filter(v=>v!=null),...med.filter(v=>v!=null),0];
  let lo=Math.min(...all),hi=Math.max(...all);
  const pad=Math.max(.25,(hi-lo)*.18); lo-=pad; hi+=pad;
  const clip=v=>Math.max(lo+0.02*(hi-lo),Math.min(hi-0.02*(hi-lo),v));
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":TX("Kumuliertes Plus-Minus","Cumulative plus-minus")});
  // Gitter mit "nice" Schrittweite (ca. 4-7 Linien)
  const niceSteps=[0.1,0.2,0.25,0.5,1,2,5];
  const step=niceSteps.find(st=>(hi-lo)/st<=7)||5;
  for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){
    const yy=Y(v);
    s.append(sv("line",{x1:L,y1:yy,x2:W-R,y2:yy,stroke:Math.abs(v)<1e-9?"#353649":"#ffffff08","stroke-width":Math.abs(v)<1e-9?1.5:1}));
    s.append(sv("text",{x:L-7,y:yy+4,"text-anchor":"end",fill:"#8A93AD","font-size":10},fmtPM(v,step<0.25?2:1)));
  }
  // Saisongrenzen
  let lastSeason=null;
  games.forEach((g,i)=>{ if(g.season!==lastSeason){
    if(lastSeason!==null)s.append(sv("line",{x1:xs(i)-3,y1:T,x2:xs(i)-3,y2:H-B,stroke:"#785EF0","stroke-width":1,"stroke-dasharray":"3 4"}));
    s.append(sv("text",{x:xs(i),y:H-B+16,"text-anchor":"start",fill:"#785EF0","font-size":10},g.season));
    lastSeason=g.season; }});
  // Kohorten-Linien
  const path=(vals)=>vals.map((v,i)=>v==null?null:`${xs(i)},${Y(clip(v))}`).filter(Boolean).join(" ");
  // rechte Rand-Labels sammeln und Kollisionen aufloesen
  const rlabels=[];
  if(cohortOk){
    if(med.some(v=>v!=null))s.append(sv("polyline",{points:path(med),fill:"none",stroke:"#8A93AD","stroke-width":1.2,"stroke-dasharray":"2 4"}));
    if(th.some(v=>v!=null))s.append(sv("polyline",{points:path(th),fill:"none",stroke:"#FFC22D","stroke-width":2,"stroke-dasharray":"7 4"}));
    const li=th.map((v,i)=>v!=null?i:null).filter(v=>v!=null).pop();
    const mi=med.map((v,i)=>v!=null?i:null).filter(v=>v!=null).pop();
    if(li!=null)rlabels.push({y:Y(clip(th[li])),txt:TX(`Top 20 % Jg. ${birthYear}`,`Top 20% born ${birthYear}`),fill:"#FFC22D",size:10});
    if(mi!=null)rlabels.push({y:Y(clip(med[mi])),txt:"Median",fill:"#8A93AD",size:10});
  }
  // Spieler-Linie: gepunktet solange < MINM kumulierte Minuten, danach durchgezogen
  const seg=(a,b)=>games.slice(a,b+1).map((g,k)=>`${xs(a+k)},${Y(clip(cum[a+k].v))}`).join(" ");
  if(solidStart!==0){
    const end=solidStart===-1?n-1:solidStart;
    s.append(sv("polyline",{points:seg(0,end),fill:"none",stroke:"#34B190","stroke-width":2.4,"stroke-dasharray":"2 5","stroke-linejoin":"round"}));
  }
  if(solidStart!==-1)
    s.append(sv("polyline",{points:seg(solidStart,n-1),fill:"none",stroke:"#34B190","stroke-width":2.6,"stroke-linejoin":"round"}));
  // Endwert + Roh-Perzentil (server-seitig: Anteil der Kohorte mit hoeherem Endwert)
  const fv=cum[n-1].v;
  s.append(sv("circle",{cx:xs(n-1),cy:Y(clip(fv)),r:4,fill:"#34B190"}));
  const pct=cohortOk&&cohort.pct!=null?cohort.pct:null;
  rlabels.push({y:Y(clip(fv))-4,txt:fmtPM(fv,2)+"/90"+(pct!=null?` · P${pct.toFixed(0)}`:""),
    fill:pct!=null&&pct<=20?"#34B190":"#E3E9F4",size:12,bold:true});
  // Kollisionen: von oben nach unten mindestens 13px Abstand erzwingen
  rlabels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<rlabels.length;i++)
    if(rlabels[i].y-rlabels[i-1].y<13)rlabels[i].y=rlabels[i-1].y+13;
  rlabels.forEach(lb=>s.append(sv("text",{x:W-R+8,y:lb.y+4,fill:lb.fill,"font-size":lb.size,
    "font-weight":lb.bold?"600":"400"},lb.txt)));
  s.append(sv("text",{x:L,y:12,fill:"#8A93AD","font-size":10},TX("kumulierte Tordifferenz pro 90 Minuten (minutengewichtet)","cumulative goal difference per 90 minutes (minute-weighted)")));
  host.append(s);
  const catLab=cat?TX(` (${cat==="Jugend"?"Jugend":"Erwachsenen"}-Bewerbe)`,` (${cat==="Jugend"?"youth":"senior"} competitions)`):"";
  host.append(el("div",{class:"legend"},
    el("span",{},el("span",{class:"sw",style:"background:#34B190"}),TX("Spieler kumuliert (gepunktet: < 270 Min., noch verrauscht; Anfang ggf. geclippt)","Player cumulative (dotted: < 270 min, still noisy; start may be clipped)")),
    el("span",{},el("span",{class:"sw",style:"background:#FFC22D"}),TX(`Top-20-%-Schwelle Jg.${birthYear?" "+birthYear:""}${catLab}, roh, ≥ 270 Min.`,`Top 20% threshold, birth year${birthYear?" "+birthYear:""}${catLab}, raw, ≥ 270 min`)),
    el("span",{},el("span",{class:"sw",style:"background:#8A93AD"}),TX("Jahrgangs-Median","Birth-year median")+catLab)));
  if(!cohortOk)host.append(el("div",{class:"pf-empty"},birthYear?
    TX("Zu wenige Jahrgangs-Spieler mit ≥ 270 Minuten für Referenzlinien.","Too few players of this birth year with ≥ 270 minutes for reference lines.")
    :TX("Kein Geburtsjahr bekannt — keine Jahrgangs-Referenz.","Birth year unknown — no birth-year reference.")));
  return pct;
}
/* Suchfeld + Container werden EINMAL gebaut; danach nur den Inhalt unter dem Suchfeld aktualisieren
   (ein offenes/ladendes Profil bleibt beim Nachladen/Retry von scout.json unangetastet). */
function renderProfileShell(){
  const sec=$("#tab-profile");
  if(!state._pfBody){
    const wrap=el("div",{class:"pf"}); sec.append(wrap);
    const search=el("input",{type:"search",class:"fctl",placeholder:TX("Spieler suchen…  ( / )","Search player…  ( / )")});
    const sug=el("div",{class:"pf-sug"});
    wrap.append(el("div",{class:"pf-search"},search,sug));
    search.oninput=()=>{
      sug.innerHTML=""; const q=norm(search.value); if(q.length<2)return;
      const hits=[]; for(const p of state.rows){ if(p.id&&p.nname.includes(q)){hits.push(p); if(hits.length>=20)break;} }
      hits.forEach(p=>{
        const row=el("div",{},`${p.name} `,el("small",{},`${p.by?(TX("Jg. ","b. ")+p.by+" · "):""}${p.team}`));
        row.onclick=()=>{sug.innerHTML=""; openProfile(p.id);};
        sug.append(row);
      });
    };
    const body=el("div"); wrap.append(body); state._pfBody=body;
  }
  if(state.profileId)return;                     // Profil offen oder am Laden: nicht ueberschreiben
  const body=state._pfBody; body.innerHTML="";
  if(!state.rows.length){
    body.append(state.loadErr?emptyMsg("error",TX(`Spielerdaten konnten nicht geladen werden:<br>${hesc(state.loadErr)}`,`Player data could not be loaded:<br>${hesc(state.loadErr)}`),loadScout)
                             :emptyMsg("loading",TX("Spielerdaten werden geladen…","Loading player data…")));
    return;
  }
  body.append(el("div",{class:"pf-empty"},TX("Spieler suchen – oder im Tab Scouting einen Namen anklicken.","Search for a player – or click a name in the Scouting tab.")));
}
let _pfToken=0;
/* Profil oeffnen: haengt NICHT an scout.json (Deep-Link #profile=<id> laedt sofort); der Name fuer den
   Ladehinweis kommt aus scout.json, falls schon da. */
async function openProfile(pid){
  pid=pid?String(pid):null; if(!pid)return;
  const t0=performance.now();
  state.profileId=pid; switchTab("profile"); window.scrollTo(0,0);
  const body=state._pfBody; if(!body)return;
  const token=++_pfToken;
  let data=state.profileCache.get(pid);
  if(!data){
    const known=state.byId.get(pid);
    body.innerHTML=""; body.append(el("div",{class:"pf-load"},TX(`Profil${known?" von "+known.name:""} lädt…`,`Loading profile${known?" of "+known.name:""}…`)));
    try{ data=await fetchJSON("api/profile/"+pid); state.profileCache.set(pid,data); }
    catch(e){
      if(token!==_pfToken)return;
      body.innerHTML="";
      body.append(emptyMsg("error",e.status===404?TX("Keine Daten zu diesem Spieler gefunden.","No data found for this player.")+`<br><small>${hesc(e.message)}</small>`
                                                 :TX("Profil konnte nicht geladen werden:","Profile could not be loaded:")+`<br>${hesc(e.message)}`,()=>openProfile(pid)));
      return;
    }
  }
  if(token!==_pfToken)return;              // inzwischen anderes Profil geoeffnet
  body.innerHTML=""; renderProfile(body,data);
  setPerf("profile",performance.now()-t0);
}

/* ---------- MATCHES (Index lazy beim ersten Oeffnen; Detail per /api/match/{id}) ---------- */
async function loadMatches(){
  if(state.mindex||state.mLoading)return;
  state.mLoading=true; state.mErr=null; renderMatches();
  try{ const d=await fetchJSON("data/matches_index.json"); state.mindex=d; state.mrows=decodeMatches(d); }
  catch(e){ state.mErr=e.message; }
  state.mLoading=false; renderMatches();
}
function decodeMatches(d){
  const C=Object.fromEntries(d.cols.map((c,i)=>[c,i])), T=d.teams, K=d.competitions;
  return d.rows.map(r=>{
    const home=r[C.home]!=null?T[r[C.home]]||"":"", away=r[C.away]!=null?T[r[C.away]]||"":"",
          comp=r[C.comp]!=null?K[r[C.comp]]||"":"", sh=+r[C.sh]||0, sa=+r[C.sa]||0;
    const m={id:String(r[C.id]),iso:r[C.iso]||"",date:r[C.date]||"",time:r[C.time]||"",comp,season:r[C.season]||"",
      round:r[C.round]||"",home,away,score:r[C.score]||"",sh,sa,goals:sh+sa,ht:r[C.ht]||"",venue:r[C.venue]||"",
      spect:r[C.spect],ref:r[C.ref]||"",nev:+r[C.nev]||0,coach_h:r[C.coach_h]||"",coach_a:r[C.coach_a]||"",url:r[C.url]||""};
    m.cat=leagueCat(comp);
    m.q=norm([home,away,comp,m.date,m.ref,m.venue,m.round].join(" "));   // Suchtext einmal vorberechnet
    m.nref=norm(m.ref);
    return m;
  });
}
function renderMatches(){
  const sec=$("#tab-matches"); sec.innerHTML=""; onShow.matches=null;
  if(!state.mindex){
    if(state.mErr)sec.append(emptyMsg("error",TX("Matches konnten nicht geladen werden:","Matches could not be loaded:")+`<br>${hesc(state.mErr)}`,()=>{state.mErr=null;loadMatches();}));
    else if(state.mLoading)sec.append(emptyMsg("loading",TX("Matches laden…","Loading matches…")));
    else sec.append(emptyMsg("empty",TX("Die Spielliste wird beim Öffnen des Tabs geladen.","The match list loads when the tab is opened.")));
    return;
  }
  const {side,content}=tabScaffold(sec);
  const all=state.mrows;
  const teams=deSort(state.mindex.teams);
  const dIso=new Map(); all.forEach(m=>{ if(m.date&&!dIso.has(m.date))dIso.set(m.date,m.iso); });
  const dateOpts=[...dIso.entries()].sort((a,b)=>a[1]<b[1]?-1:a[1]>b[1]?1:0).map(e=>e[0]);   // Datum nach ISO sortiert
  const fb=makeFilterBar(side,all,[
    {key:"q",type:"text",label:TX("Suche","Search"),placeholder:TX("Team, Bewerb, Datum, SR…  ( / )","Team, competition, date, referee…  ( / )"),get:m=>m.q,nget:m=>m.q},
    {key:"cat",type:"select",label:TX("Kategorie","Category"),options:["Erwachsen","Jugend"],get:m=>m.cat,disp:catLabel},
    {key:"comp",type:"select",label:TX("Bewerb","Competition"),get:m=>m.comp},
    {key:"team",type:"select",label:"Team",options:teams,pred:v=>{const s=new Set(Array.isArray(v)?v:[v]);return m=>s.has(m.home)||s.has(m.away);}},
    {key:"date",type:"select",label:TX("Datum","Date"),options:dateOpts,get:m=>m.date},
    {key:"goals",type:"range",label:TX("Tore gesamt","Total goals"),get:m=>m.goals},
    {key:"ev",type:"range",label:TX("Ereignisse","Events"),get:m=>m.nev},
    {key:"zus",type:"range",label:TX("Zuschauer","Spectators"),get:m=>+m.spect||0},
    {key:"ref",type:"text",label:TX("Schiedsrichter","Referee"),get:m=>m.ref,nget:m=>m.nref},
  ],()=>scheduleDraw());

  const cols=[{k:"date",l:TX("Datum","Date"),w:96},{k:"time",l:TX("Zeit","Time"),w:60},{k:"home",l:TX("Heim","Home"),flex:1,min:150},{k:"score",l:TX("Stand","Score"),w:66},
              {k:"away",l:TX("Gast","Away"),flex:1,min:150},{k:"comp",l:TX("Bewerb","Comp."),flex:0.9,min:124,t:compLegend(),tl:TX("Bewerb","Competition")},{k:"nev",l:"Events",w:74}];
  const tableWrap=el("div",{class:"tblscroll"});           // eigener Scroll-Container wie im Scouting
  content.append(el("div",{class:"content-head"},fb.count,el("span",{class:"count",style:"margin-left:auto"},TX("Zeile anklicken für Aufstellung und Ereignisse","Click a row for line-ups and events"))),tableWrap);
  let cur=[];
  const vt=VirtualTable(tableWrap,{emptyText:TX("Keine Spiele für diese Filter.","No matches for these filters."),
    sortState:()=>state.sortM,
    onSort:c=>{state.sortM.dir=state.sortM.k===c.k?-state.sortM.dir:1;state.sortM.k=c.k;draw();},
    renderRow:m=>{
      const tr=el("tr",{class:"mrow","data-id":m.id});
      tr.append(el("td",{},m.date),el("td",{},m.time),
        el("td",{title:m.home},m.home),el("td",{class:"score"},m.score),
        el("td",{title:m.away},m.away),el("td",{title:m.comp},m.comp?el("span",{class:"tag"},shortComp(m.comp)):""),
        el("td",{class:"num"},String(m.nev)));
      return tr;
    }});
  vt.setCols(cols);
  const byId=new Map(all.map(m=>[m.id,m]));
  // Zeile anklicken -> Detail auf/zu (nur eines offen, erneuter Klick schliesst); Detailzeile lebt in state.openDetail
  tableWrap.addEventListener("click",e=>{
    const tr=e.target.closest("tr.mrow"); if(!tr)return;
    const m=byId.get(tr.dataset.id); if(!m)return;
    if(state.open===m.id){state.open=null;state.openDetail=null;vt.setOpen(null,null);return;}
    state.open=m.id; state.openDetail=detailRow(m,()=>vt.relayout());
    vt.setOpen(cur.indexOf(m),state.openDetail);
  });
  function draw(){
    const rows=fb.apply(all);
    const k=state.sortM.k,d=state.sortM.dir;
    // Datum ueber ISO; Gleichstand behaelt die Grundreihenfolge der Datei (stabiler Sort)
    if(k==="date")rows.sort((a,b)=>(a.iso>b.iso?1:a.iso<b.iso?-1:0)*d);
    else if(k==="nev")rows.sort((a,b)=>(a.nev-b.nev)*d);
    else rows.sort((a,b)=>{const va=a[k],vb=b[k];return (va>vb?1:va<vb?-1:0)*d;});
    fb.count.innerHTML=`<b>${nf(rows.length)}</b> / ${nf(all.length)} Matches`;
    cur=rows;
    const oi=state.open?rows.findIndex(m=>m.id===state.open):-1;
    vt.setRows(rows,oi,oi>=0?state.openDetail:null);
  }
  const scheduleDraw=coalesce(draw);
  onShow.matches=()=>vt.relayout();
  draw();
}
const EVICON={goal:"⚽",yellow:"🟨",yellow_red:"🟨🟥",red:"🟥",substitution:"⇄"};
function loadMatch(id){
  if(!state.matchCache.has(id))state.matchCache.set(id,fetchJSON("api/match/"+id).catch(e=>{state.matchCache.delete(id);throw e;}));
  return state.matchCache.get(id);
}
/* Detailzeile eines Spiels; after() wird nach dem (asynchronen) Fuellen gerufen (Hoehe neu messen) */
function detailRow(m,after){
  const td=el("td",{class:"dt",colspan:"7"}); const wrap=el("div",{class:"detail"});
  wrap.append(el("h3",{},`${m.home} ${m.score} ${m.away}`));
  const meta=[m.date&&m.time?`${m.date} ${m.time}`:m.date,m.comp,m.round,m.venue,
    m.spect?m.spect+TX(" Zuschauer"," spectators"):null,m.ref?TX("SR ","Ref. ")+m.ref:null,
    m.ht?TX("HZ ","HT ")+m.ht:null].filter(Boolean).join(" · ");
  wrap.append(el("div",{class:"meta"},meta));
  if(m.url)wrap.querySelector(".meta").append(" ",el("a",{class:"ext",href:m.url,target:"_blank"},TX("↗ Quelle","↗ Source")));
  const body=el("div"); wrap.append(body);
  body.append(el("div",{class:"meta"},TX("Aufstellung lädt…","Loading line-ups…")));
  loadMatch(m.id).then(d=>{ if(state.open!==m.id)return; body.innerHTML=""; fillDetail(body,m,d); if(after)after(); })
    .catch(e=>{ body.innerHTML=""; body.append(el("div",{class:"meta",style:"color:#FF6F70"},TX("Spiel konnte nicht geladen werden: ","Match could not be loaded: ")+esc(e.message))); if(after)after(); });
  td.append(wrap); return el("tr",{class:"mdetail"},td);
}
function fillDetail(body,m,d){
  const lu=d.lineup||{};
  const cols=el("div",{class:"cols"});
  cols.append(lineupBlock(m.home,m.coach_h,lu.home||[]),lineupBlock(m.away,m.coach_a,lu.away||[]));
  body.append(cols);
  const evs=(d.events||[]);
  body.append(el("div",{class:"sub",style:"color:var(--muted);margin:16px 0 6px;font-size:11px;text-transform:uppercase"},TX(`Ereignisse (${evs.length})`,`Events (${evs.length})`)));
  if(evs.length){ const ul=el("ul",{class:"ev"});
    evs.forEach(e=>{const side=e.team==="home"?"◀ ":e.team==="away"?"▶ ":"";
      let txt=esc(e.player); if(e.type==="substitution")txt=`${esc(e.player||"?")} ${e.player_out?"↔ "+esc(e.player_out):""}`;
      ul.append(el("li",{},el("span",{class:"min"},(e.minute||"")+(/^\d+$/.test(e.minute||"")?"'":"")),
        el("span",{class:"ic"},EVICON[e.type]||"•"),el("span",{},side+txt+(e.detail&&e.type!=="substitution"?" — "+esc(e.detail):""))));});
    body.append(ul);
  } else body.append(el("div",{class:"meta"},TX("keine Ereignisse","no events")));
}
/* Aufstellungsblock: Alter = exaktes Alter aus scout.json (am ref_date), sonst Jahr(ref_date) − Jahrgang */
function lineupBlock(team,coach,list){
  const b=el("div",{class:"lu"});
  const h=esc(team)+(coach?TX(" · TR "," · Coach ")+esc(coach):"");
  if(h)b.append(el("h4",{},h));                     // Spiel ohne Teams (7 Spielberichte): keine leere Ueberschrift
  if(!list||!list.length){b.append("—");return b;}
  const refYear=+String(state.scout&&state.scout.ref_date||"").slice(0,4)||new Date().getFullYear();
  const mk=(title,arr)=>{ if(!arr.length)return;
    b.append(el("div",{class:"sub"},title));
    const t=el("table"),tb=el("tbody");
    arr.forEach(p=>{
      const sp=p.player_id?state.byId.get(String(p.player_id)):null;
      const ageV=sp&&sp.age!=null?sp.age:(p.birth_year?refYear-p.birth_year:null);
      const age=ageV!=null?String(ageV):"";
      let min="", title2="";
      if(p.minutes!=null&&p.minutes!==""){ min=p.minutes+"'";
        if(p.on_min>0)title2=TX("ein","on")+` ${p.on_min}'`; if(p.off_min)title2+=(title2?", ":"")+TX("aus","off")+` ${p.off_min}'`;
        if(+p.minutes===0)min="–"; }
      tb.append(el("tr",{},el("td",{class:"num",style:"width:28px;color:var(--muted)"},esc(p.number)),
        el("td",{},esc(p.name)+(p.captain?" ":""),p.captain?el("span",{class:"cap"},"©"):""),
        el("td",{class:"num",style:"width:34px;color:var(--muted)"},age),
        el("td",{class:"num",style:"width:48px",title:title2},min)));});
    t.append(tb); b.append(t); };
  mk(TX("Startelf","Starting XI"),list.filter(p=>p.role==="starter")); mk(TX("Bank","Bench"),list.filter(p=>p.role!=="starter"));
  return b;
}
