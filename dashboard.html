<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖFB Daten-Dashboard</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a313d;
    --text:#e6e9ef; --muted:#9aa4b2; --accent:#b16286; --accent2:#4c8bf5;
    --good:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text)}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:sticky;top:0;z-index:6}
  header h1{font-size:17px;margin:0;margin-right:8px}
  header h1 small{color:var(--muted);font-weight:400;font-size:12px}
  .drop{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);
        font-size:12px;cursor:pointer;transition:.15s;background:var(--panel2)}
  .drop:hover,.drop.over{border-color:var(--accent2);color:var(--text)}
  .drop b{color:var(--text)}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);
        border:1px solid var(--line)}
  .pill.on{color:var(--good);border-color:var(--good)}
  nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);
      position:sticky;top:53px;z-index:5}
  nav button{background:none;border:none;color:var(--muted);padding:12px 16px;cursor:pointer;
             font-size:14px;border-bottom:2px solid transparent}
  nav button.active{color:var(--text);border-bottom-color:var(--accent)}
  main{padding:18px 20px;max-width:1500px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
  input[type=search],select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
        padding:9px 12px;border-radius:8px;font-size:14px;min-width:0}
  input[type=search]{flex:1;min-width:200px}
  input[type=search]:focus,select:focus{outline:none;border-color:var(--accent2)}
  .count{color:var(--muted);font-size:12px;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:98px;background:var(--bg);z-index:1}
  th:hover{color:var(--text)}
  tbody tr:hover{background:var(--panel)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--muted)}
  .score{font-weight:700;font-variant-numeric:tabular-nums}
  .mrow{cursor:pointer}
  .detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:6px 0 14px;padding:16px}
  .detail h3{margin:0 0 4px}
  .meta{color:var(--muted);font-size:12px;margin-bottom:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .lu h4{margin:0 0 6px;font-size:13px;color:var(--accent2)}
  .lu table{font-size:12px}
  .lu .sub{color:var(--muted);margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .ev{list-style:none;padding:0;margin:0;font-size:13px}
  .ev li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
  .ev .min{width:42px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .ev .ic{width:20px;text-align:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:50px 20px}
  .empty code{background:var(--panel2);padding:2px 6px;border-radius:4px;color:var(--text)}
  .cap{color:var(--warn)}
  a.ext{color:var(--accent2);text-decoration:none}
  a.ext:hover{text-decoration:underline}
  .barbg{background:var(--panel2);border-radius:4px;height:7px;overflow:hidden;min-width:60px}
  .bar{height:100%;background:var(--accent)}
  select{cursor:pointer}
  /* ---- Layout: Sidebar-Filter + Tabelle nebeneinander ---- */
  .tabwrap{display:flex;gap:22px;align-items:flex-start}
  .sidebar{width:300px;flex:none;position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;
        background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .content{flex:1;min-width:0}
  .content-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:24px}
  .content-head h3{margin:0;font-size:15px}
  @media(max-width:880px){.tabwrap{flex-direction:column}
    .sidebar{width:100%;position:static;max-height:none}}
  .sb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sb-title{font-size:15px;font-weight:600}
  .sb-fields{display:flex;flex-direction:column;gap:15px;margin-top:14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .fctl{background:var(--panel2);border:1px solid var(--line);color:var(--text);
        padding:9px 11px;border-radius:9px;font-size:13px;width:100%}
  .fctl:focus{outline:none;border-color:var(--accent2)}
  .fbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
        padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap}
  .fbtn:hover{border-color:var(--accent2);color:var(--text)}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .preset{font-size:11px;padding:4px 9px}
  /* Scroll-Container für die breite Scouting-Tabelle: eigener Scroll (beide
     Achsen), Kopfzeile klebt an dessen Oberkante statt am Viewport. */
  .tblscroll{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:10px}
  .tblscroll thead th{position:sticky;top:0;z-index:2;background:var(--panel)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chips:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--accent);
        color:var(--text);padding:4px 5px 4px 10px;border-radius:20px;font-size:12px}
  .chip .x{cursor:pointer;color:var(--muted);font-size:16px;line-height:.9;padding:0 4px;border-radius:50%}
  .chip .x:hover{color:#fff}
  .count{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:auto}
  .ms{position:relative}
  .ms-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;
        background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;
        border-radius:9px;font-size:13px;cursor:pointer;text-align:left}
  .ms-btn:hover{border-color:var(--accent2)}
  .ms-caret{color:var(--muted);font-size:10px}
  .ms-pop{display:none;margin-top:6px;background:var(--panel2);border:1px solid var(--line);
        border-radius:9px;padding:6px;max-height:230px;overflow:auto}
  .ms-pop.open{display:block}
  .ms-search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
        padding:6px 9px;border-radius:7px;font-size:12px;margin-bottom:6px}
  .ms-search:focus{outline:none;border-color:var(--accent2)}
  .ms-list{display:flex;flex-direction:column;gap:1px}
  .ms-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;cursor:pointer}
  .ms-opt:hover{background:var(--panel)}
  .ms-opt input{accent-color:var(--accent);flex:none}
  /* ---- Methodik / Erklärung ---- */
  .explain{max-width:1000px;margin:0 auto;line-height:1.65}
  .explain .lead{color:var(--muted);font-size:15px;margin:2px 0 8px}
  .explain .lead b{color:var(--text)}
  .explain .cite{font-size:12px;color:var(--muted);margin:0 0 26px}
  .step{display:grid;grid-template-columns:42px 1fr;gap:16px;margin:0 0 34px}
  .step .n{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
  .step h3{margin:3px 0 8px;font-size:17px}
  .step .body{min-width:0}
  .step p{margin:6px 0}
  .viz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
  .viz svg{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
  .eq{font-family:"Cambria Math","Latin Modern Math","Times New Roman",Georgia,serif;
        font-size:18px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
        padding:16px;margin:14px 0;overflow-x:auto;text-align:center;white-space:nowrap}
  .eq small{font-size:12px;color:var(--muted);display:block;white-space:normal;margin-top:6px;
        font-family:-apple-system,sans-serif;text-align:center}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;font-size:14px}
  .frac .den{border-top:1px solid currentColor;padding-top:1px}
  .big{font-size:24px;vertical-align:-4px;margin:0 2px}
  .t-off{color:#3fb950}
  .t-def{color:#f0836b}
  .t-hfa{color:#4c8bf5}
  .t-man{color:#d8a12a}
  .t-reg{color:#c98bc0}
  .note{border-left:3px solid var(--accent);background:var(--panel);padding:11px 14px;
        border-radius:0 8px 8px 0;margin:14px 0;font-size:13px;color:var(--muted)}
  .note b{color:var(--text)}
  /* ---- Spielerprofil ---- */
  .plink{color:var(--accent2);cursor:pointer}
  .plink:hover{text-decoration:underline}
  .pf{max-width:1100px;margin:0 auto}
  .pf-search{position:relative;max-width:420px;margin-bottom:18px}
  .pf-sug{position:absolute;top:100%;left:0;right:0;z-index:8;background:var(--panel2);
        border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:280px;overflow:auto}
  .pf-sug:empty{display:none}
  .pf-sug div{padding:7px 11px;cursor:pointer;font-size:13px}
  .pf-sug div:hover{background:var(--panel)}
  .pf-sug small{color:var(--muted)}
  .pf-head{display:flex;gap:18px;align-items:flex-start;background:var(--panel);
        border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
  .pf-foto{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--panel2);flex:none}
  .pf-foto.ph{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--muted)}
  .pf-id{flex:1;min-width:220px}
  .pf-id h2{margin:0 0 4px;font-size:20px}
  .pf-meta{color:var(--muted);font-size:13px;line-height:1.7}
  .pf-meta b{color:var(--text)}
  .pf-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel2);
        border:1px solid var(--line);color:var(--muted)}
  .badge b{color:var(--text)}
  .badge.hl{border-color:var(--good);color:var(--good)}
  .badge.hl b{color:var(--good)}
  .pf-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .pf-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .pf-card .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .pf-card .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .pf-splitbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px}
  .pf-splitbar div{height:100%}
  .pf h3{margin:22px 0 10px;font-size:15px}
  .pf h3 small{color:var(--muted);font-weight:400;font-size:12px}
  .cat-j{color:#d29922}.cat-e{color:#4c8bf5}
  .pf-empty{color:var(--muted);font-size:13px;padding:8px 0}
  .pm-pos{color:var(--good)}.pm-neg{color:#f0836b}
  .res{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;
       font-size:11px;font-weight:700;margin-left:7px;vertical-align:1px}
  .res-S{background:#1c3a24;color:var(--good)}
  .res-N{background:#3d1f1c;color:#f0836b}
  .res-U{background:var(--panel2);color:var(--muted)}
  .bench{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
        padding:10px 14px;margin-top:12px}
  .bench table{font-size:12px;border-collapse:collapse;width:auto;min-width:340px}
  .bench td{padding:3px 12px 3px 0;border:none;vertical-align:middle}
  .bench .barbg{width:110px}
  .bench .lab{color:var(--muted)}
  .bench .lab.good{color:var(--good)}
  .bench .expl{font-size:11px;color:var(--muted);margin-top:7px}
  .pf-card .sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
  .pf-card .sub b{color:var(--text)}
  .copybtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;
        padding:3px 9px;font-size:12px;cursor:pointer;vertical-align:2px;white-space:nowrap}
  .copybtn:hover{border-color:var(--accent2);color:var(--text)}
  .copybtn.big{padding:8px 14px;font-size:13px;flex:none;align-self:flex-start;margin-left:auto}
  .symtab{font-size:13px;border-collapse:collapse;margin:8px 0}
  .symtab td{padding:3px 12px 3px 0;border:none;vertical-align:top}
  .symtab td:first-child{font-family:"Cambria Math",Georgia,serif;color:var(--text);white-space:nowrap}
  @media(max-width:760px){.step{grid-template-columns:1fr}.step .n{margin-bottom:-10px}}
</style>
</head>
<body>
<header>
  <h1>⚽ ÖFB Scouting <small>Spieler-Datenbank</small></h1>
  <span class="pill" id="pillP">lädt…</span>
  <span class="pill" id="pillR">Ratings</span>
  <span class="pill" id="pillM">Matches</span>
</header>
<nav>
  <button data-tab="scout" class="active">Scouting</button>
  <button data-tab="stats">Statistik</button>
  <button data-tab="explain">Methodik</button>
  <button data-tab="profile">Profil</button>
  <button data-tab="matches">Matches</button>
</nav>
<main>
  <section id="tab-scout"></section>
  <section id="tab-stats" hidden></section>
  <section id="tab-explain" hidden></section>
  <section id="tab-profile" hidden></section>
  <section id="tab-matches" hidden></section>
</main>

<script src="histogram-range.js"></script>
<script>
"use strict";
const state = { matches: [], players: [], ratings: [], sortM:{k:"date",dir:1}, sortS:{k:"avg",dir:-1}, sortSc:{k:"total",dir:-1}, open:null,
  profileKey:null, extras:null, extrasLoading:false, scoutCols:null };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){
  if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else e.setAttribute(k,a[k]);}
  for(const c of kids)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const esc = s => (s==null?"":String(s));
const norm = s => esc(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function parseCSV(text){
  const rows=[]; let i=0,f="",row=[],q=false;
  const pushF=()=>{row.push(f);f="";}, pushR=()=>{rows.push(row);row=[];};
  while(i<text.length){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"')q=true; else if(c===',')pushF(); else if(c==='\n'){pushF();pushR();}
           else if(c==='\r'){} else f+=c; }
    i++;}
  if(f.length||row.length){pushF();pushR();}
  const head=rows.shift()||[];
  return rows.filter(r=>r.length>1||r[0]).map(r=>Object.fromEntries(head.map((h,j)=>[h,r[j]??""])));
}

/* Daten werden automatisch geladen (Server/Pipeline); kein manueller Upload mehr. */
async function tryAuto(url,onText){
  try{const r=await fetch(url); if(r.ok)onText(await r.text());}catch(e){} }

/* ---------- tabs ---------- */
const TABS=["scout","stats","explain","profile","matches"];
function switchTab(tab){
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  for(const t of TABS) $("#tab-"+t).hidden = (t!==tab);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

/* ---------- generic filter framework ---------- */
function uniqueVals(rows,get){
  const s=new Set();
  rows.forEach(r=>{const v=get(r); if(v!=null&&v!=="")s.add(v);});
  return [...s].sort((a,b)=>{const na=+a,nb=+b;
    return (!isNaN(na)&&!isNaN(nb))?na-nb:String(a).localeCompare(String(b),"de");});
}
const truthy=v=>v===true||v==="True"||v==="true"||v==="1"||v==="X"||v==="x";
const emptyVal=v=>v==null||v===""||
  (Array.isArray(v)&&(v.length===0||(v.length===2&&v[0]===""&&v[1]==="")));
function matchDef(def,v,row){
  if(def.test)return def.test(row,v);
  const cell=def.get(row);
  if(def.type==="text")return norm(cell).includes(norm(v));
  if(def.type==="select")return (Array.isArray(v)?v:[v]).map(String).includes(String(cell));
  if(def.type==="bool")return truthy(cell)===(v==="ja");
  if(def.type==="range"){const n=Number(cell); if(isNaN(n))return false;
    if(v[0]!==""&&n<+v[0])return false; if(v[1]!==""&&n>+v[1])return false; return true;}
  return true;
}
function chipText(def,v){
  const f=def.format||(x=>x);
  if(def.type==="range")return `${def.label} ${v[0]!==""?"≥"+f(v[0]):""}${v[0]!==""&&v[1]!==""?" ":""}${v[1]!==""?"≤"+f(v[1]):""}`;
  if(def.type==="bool")return `${def.label}: ${v}`;
  if(def.type==="text")return `„${v}"`;
  if(def.type==="select"){const a=Array.isArray(v)?v:[v];
    return `${def.label}: ${a.length>2?a.length+" gewählt":a.join(", ")}`;}
  return `${def.label}: ${v}`;
}
/* Multiselect-Dropdown (Checkboxen, optional mit Suche) */
function multiSelectControl(options,onChange){
  const sel=new Set();
  const wrap=el("div",{class:"ms"});
  const btn=el("button",{class:"ms-btn",type:"button"},"alle",el("span",{class:"ms-caret"},"▾"));
  const pop=el("div",{class:"ms-pop"});
  const search=options.length>8?el("input",{class:"ms-search",type:"search",placeholder:"filtern…"}):null;
  const list=el("div",{class:"ms-list"});
  if(search)pop.append(search); pop.append(list); wrap.append(btn,pop);
  const label=()=>{btn.firstChild.nodeValue=sel.size?(sel.size+" gewählt"):"alle";};
  function renderList(){
    const q=search?norm(search.value):""; list.innerHTML="";
    options.filter(o=>!q||norm(o).includes(q)).forEach(o=>{
      const row=el("label",{class:"ms-opt"});
      const cb=el("input",{type:"checkbox"}); cb.checked=sel.has(o);
      cb.onchange=()=>{cb.checked?sel.add(o):sel.delete(o); label(); onChange([...sel]);};
      row.append(cb,document.createTextNode(o)); list.append(row);
    });
  }
  if(search)search.oninput=renderList;
  btn.onclick=()=>{const o=pop.classList.toggle("open"); if(o)renderList();};
  renderList();
  return {element:wrap,clear:()=>{sel.clear();label();renderList();}};
}
/* Sidebar-Filter: alle Filter gestapelt & dauerhaft sichtbar; Range = Histogramm-Slider */
function makeFilterBar(host,rows,defs,onChange){
  const f={};                       // key -> {def,v}
  const ctl={};                     // key -> clear()
  const count=el("span",{class:"count"});
  const reset=el("button",{class:"fbtn"},"Reset");
  const head=el("div",{class:"sb-head"},el("span",{class:"sb-title"},"Filter"),reset);
  const chips=el("div",{class:"chips"});
  const fields=el("div",{class:"sb-fields"});
  host.append(head,chips,fields);

  const set=(def,v)=>{ if(emptyVal(v))delete f[def.key]; else f[def.key]={def,v}; refresh(); };

  defs.forEach(def=>{
    const field=el("div",{class:"field"});
    field.append(el("span",{class:"flabel"},def.label));
    let inp;
    if(def.type==="text"){
      inp=el("input",{type:"search",class:"fctl",placeholder:def.placeholder||"suchen…"});
      inp.oninput=()=>set(def,inp.value); ctl[def.key]=()=>inp.value="";
    } else if(def.type==="select"){
      const opts=def.options||uniqueVals(rows,def.get);
      const ms=multiSelectControl(opts,arr=>set(def,arr));
      inp=ms.element; ctl[def.key]=()=>ms.clear();
    } else if(def.type==="bool"){

      inp.onchange=()=>set(def,inp.value); ctl[def.key]=()=>inp.selectedIndex=0;
    } else if(def.type==="range"){
      let vals=rows.map(def.get).map(Number).filter(v=>!isNaN(v));
      if(def.min!=null)vals=vals.filter(v=>v>=def.min);   // unsinnige Kleinstwerte ausblenden
      if(def.max!=null)vals=vals.filter(v=>v<=def.max);
      const hr=HistogramRange({values:vals,step:def.step||1,format:def.format,
        scale:def.scale||"linear",histo:def.histo!==false,min:def.min,max:def.max,
        inputs:true,onChange:r=>set(def,r)});
      ctl[def.key]=()=>hr.reset();
      inp=hr.element;
      field.append(inp);
      if(def.presets){                          // Schnellauswahl-Buttons (z.B. Top 20%)
        const pr=el("div",{class:"presets"});
        def.presets.forEach(([lab,rng])=>{
          const b=el("button",{class:"fbtn preset",type:"button"},lab);
          b.onclick=()=>{hr.setRange(rng[0]===""?null:rng[0],rng[1]===""?null:rng[1]);set(def,rng);};
          pr.append(b);
        });
        field.append(pr);
      }
      fields.append(field); return;
    }
    field.append(inp); fields.append(field);
  });

  reset.onclick=()=>{Object.keys(f).forEach(k=>delete f[k]);Object.values(ctl).forEach(c=>c());refresh();};

  function refresh(){
    chips.innerHTML="";
    Object.entries(f).forEach(([k,{def,v}])=>{
      const chip=el("span",{class:"chip"},chipText(def,v),el("span",{class:"x"},"×"));
      chip.querySelector(".x").onclick=()=>{delete f[k]; ctl[k]&&ctl[k](); refresh();};
      chips.append(chip);
    });
    onChange();
  }
  const apply=data=>data.filter(row=>Object.values(f).every(({def,v})=>matchDef(def,v,row)));
  return {apply,count};
}

// Aggregiert die per-Einsatz-Zeilen zu EINER Zeile pro Spieler (Summen/Sets).
function aggregatePlayers(players,compMap){
  const by=new Map();
  players.forEach(p=>{
    const key=p.player_id||p.name+"|"+p.team, c=compMap[String(p.match_id)]||"";
    if(!by.has(key))by.set(key,{player_id:p.player_id,name:p.name,team:p.team,
      age:p.age?+p.age:"",birth_year:p.birth_year,position:p.position,role:p.role,
      nationality:p.nationalitaet||"",verband:p.verband||"",
      captain:truthy(p.captain),minutes:+p.minutes||0,goals:+p.goals||0,matches:1,
      _teams:new Set([p.team]),_comps:new Set([c]),_pos:{}});
    else{const o=by.get(key); o.matches++; o.minutes+=+p.minutes||0; o.goals+=+p.goals||0;
      o._teams.add(p.team); o._comps.add(c); if(truthy(p.captain))o.captain=true;
      if(p.role==="starter")o.role="starter";
      if(!o.nationality&&p.nationalitaet)o.nationality=p.nationalitaet;
      if(!o.verband&&p.verband)o.verband=p.verband;
      if(o.age===""&&p.age)o.age=+p.age; if(!o.birth_year&&p.birth_year)o.birth_year=p.birth_year;}
    const o=by.get(key); if(p.position)o._pos[p.position]=(o._pos[p.position]||0)+1;
  });
  return [...by.values()].map(o=>{
    const pos=Object.entries(o._pos).sort((a,b)=>b[1]-a[1])[0];
    return {...o, position:pos?pos[0]:(o.position||""),
      team:[...o._teams].filter(Boolean).join(", "),
      comp:[...o._comps].filter(Boolean).join(", ")};
  });
}

function scoutRows(){                              // 1 Zeile je Spieler: Aggregat + Rating
  const sig=state.players.length+"|"+state.ratings.length+"|"+state.matches.length;

  const agg=aggregatePlayers(state.players,compMapFromMatches());
  const rmap=new Map(state.ratings.map(r=>[String(r.player_id),r]));
  const num=v=>(v===""||v==null||isNaN(+v))?"":+v;

    return {...p, off:r?num(r.off):"", def:r?num(r.def):"", total:r?num(r.total):"",
            peak:r?num(r.peak):"", pct_talent:r?num(r.pct_talent):""};

    let groups=[...by.entries()].map(([g,o])=>({g,
      avg:o.ages.length?o.ages.reduce((x,y)=>x+y,0)/o.ages.length:0,
      min:o.ages.length?Math.min(...o.ages):0,max:o.ages.length?Math.max(...o.ages):0,
      avgMin:o.mins.length?o.mins.reduce((x,y)=>x+y,0)/o.mins.length:0,
      n:o.ages.length})).filter(x=>x.n);
    const k=state.sortS.k,d=state.sortS.dir;
    groups.sort((a,b)=>{const va=k==="g"?norm(a.g):(k==="span"?a.min:a[k]),
      vb=k==="g"?norm(b.g):(k==="span"?b.min:b[k]); return (va>vb?1:va<vb?-1:0)*d;});
    const maxAvg=Math.max(...groups.map(t=>t.avg),1);
    head.textContent=`Ø Alter je ${grpSel.value} — ${rows.length} Spieler in ${groups.length} Gruppen`;
    fb.count.textContent=rows.length+" / "+rowsAll.length+" Spieler";
    tb.innerHTML="";
    groups.forEach(t=>{ tb.append(el("tr",{},
      el("td",{},esc(t.g)),el("td",{class:"num"},t.avg.toFixed(1)),
      el("td",{},el("div",{class:"barbg"},el("div",{class:"bar",style:`width:${t.avg/maxAvg*100}%`}))),
      el("td",{class:"num"},`${t.min}–${t.max}`),
      el("td",{class:"num"},Math.round(t.avgMin)+"'"),
      el("td",{class:"num"},String(t.n)))); });
  }
  draw();
}

function aggList(){ if(_aggN!==state.players.length){_aggCache=aggregatePlayers(state.players,compMapFromMatches());_aggN=state.players.length;} return _aggCache; }
function matchMap(){ if(_matchN!==state.matches.length){_matchMap={};state.matches.forEach(m=>_matchMap[String(m.match_id)]=m);_matchN=state.matches.length;} return _matchMap; }
function dIso(d){const m=/(\d{2})\.(\d{2})\.(\d{4})/.exec(d||"");return m?`${m[3]}-${m[2]}-${m[1]}`:"";}
function seasonOf(d){const m=/(\d{2})\.(\d{2})\.(\d{4})/.exec(d||"");if(!m)return "?";
  const yy=+m[3],mm=+m[2];return mm<7?`${yy-1}/${String(yy).slice(2)}`:`${yy}/${String(yy+1).slice(2)}`;}
function fmtPM(v,dec=0){const n=+v;return (n>0?"+":"")+n.toFixed(dec);}

/* Text in die Zwischenablage kopieren; kurzes Erfolgs-Feedback am Button */
function copyText(txt,btn){
  const done=()=>{ if(!btn)return; const old=btn.textContent; btn.textContent="✓ kopiert";
    setTimeout(()=>{btn.textContent=old;},1500); };
  const fallback=()=>{ try{
      const ta=document.createElement("textarea"); ta.value=txt;
      ta.style.position="fixed"; ta.style.opacity="0";
      (document.body||document.documentElement).appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }catch(e){} done(); };
  if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,fallback);
  else fallback();
}

/* Roh-+/- eines Spielers in einem Match: Tore fuer/gegen waehrend Anwesenheit.
   pm=null, wenn die Tor-Timeline unvollstaendig ist (weniger Tor-Events mit
   Minute als der Score verlangt) — solche Spiele fliegen aus allen
   +/--Aggregaten, statt faelschlich als 0 zu zaehlen. */
function rawPM(m,side,on,off){
  const expected=(+m.score_home||0)+(+m.score_away||0);
  let gf=0,ga=0,cnt=0;
  for(const e of (m.events||[])){
    if(e.type!=="goal")continue;
    const mm=parseInt(e.minute,10); if(isNaN(mm))continue;
    cnt++;
    if(mm<on||mm>off)continue;
    if(e.team===side)gf++; else if(e.team==="home"||e.team==="away")ga++;
  }
  if(expected>0&&cnt<expected)return {gf:null,ga:null,pm:null};
  return {gf,ga,pm:gf-ga};
}
/* Alle Einsaetze des Spielers, chronologisch, mit Kontext */
function playerGames(rows){
  const mm=matchMap(),out=[];
  for(const p of rows){
    const m=mm[String(p.match_id)]; if(!m)continue;
    const mins=+p.minutes||0; if(mins<=0)continue;
    const on=+p.on||0, off=(p.off===""||p.off==null)?90:+p.off;
    const {gf,ga,pm}=rawPM(m,p.side,on,off);
    // Endstand aus Team-Perspektive (sf = eigene Tore) + Sieg/Unentschieden/Niederlage
    const sh=+m.score_home||0, sa2=+m.score_away||0;
    const sf=p.side==="home"?sh:sa2, sg=p.side==="home"?sa2:sh;
    out.push({iso:dIso(m.date),date:m.date,season:seasonOf(m.date),comp:m.competition||"",
      cat:leagueCat(m.competition),team:p.team,opp:p.side==="home"?m.away_team:m.home_team,
      ha:p.side==="home"?"H":"A",score:m.score||"",sf,sg,res:sf>sg?"S":(sf<sg?"N":"U"),
      min:mins,on,off:(p.off===""||p.off==null)?null:+p.off,
      goals:+p.goals||0,gf,ga,pm,pos:p.position,role:p.role});
  }
  out.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0);
  return out;
}
/* SVG: +/- je Match + minutengewichteter Running Average (Fenster 5) */
function drawPMChart(host,games){
  const W=920,H=280,L=44,R=14,T=18,B=46,n=games.length;
  const xs=i=>n>1?L+i*(W-L-R)/(n-1):(L+(W-L-R)/2);
  const vals=games.map(g=>g.pm);
  let lo=Math.min(-1,...vals),hi=Math.max(1,...vals);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Plus-Minus-Verlauf"});
  // y-Gitter
  for(let v=Math.ceil(lo);v<=Math.floor(hi);v++){
    s.append(sv("line",{x1:L,y1:Y(v),x2:W-R,y2:Y(v),stroke:v===0?"#2a313d":"#ffffff08",
      "stroke-width":v===0?1.5:1}));
    s.append(sv("text",{x:L-7,y:Y(v)+4,"text-anchor":"end",fill:"#9aa4b2","font-size":10},fmtPM(v)));
  }
  // Saisongrenzen
  let lastSeason=null;
  games.forEach((g,i)=>{ if(g.season!==lastSeason){
    if(lastSeason!==null)s.append(sv("line",{x1:xs(i)-3,y1:T,x2:xs(i)-3,y2:H-B,stroke:"#b16286","stroke-width":1,"stroke-dasharray":"3 4"}));
    s.append(sv("text",{x:xs(i),y:H-B+16,"text-anchor":"start",fill:"#b16286","font-size":10},g.season));
    lastSeason=g.season; }});
  // Running Average (minutengewichtet, Fenster 5)
  const WIN=5,pts=[];
  for(let i=0;i<n;i++){
    let sw=0,sv2=0;
    for(let j=Math.max(0,i-WIN+1);j<=i;j++){sw+=games[j].min;sv2+=games[j].pm*games[j].min;}
    pts.push(`${xs(i)},${Y(sw?sv2/sw:0)}`);
  }
  s.append(sv("polyline",{points:pts.join(" "),fill:"none",stroke:"#3fb950","stroke-width":2.2,"stroke-linejoin":"round"}));
  // Punkte je Match
  games.forEach((g,i)=>{

    const dot=sv("circle",{cx:xs(i),cy:Y(g.pm),r:2.2+2.6*Math.min(1,g.min/90),
      fill:c,"fill-opacity":.35+.6*Math.min(1,g.min/90),stroke:c,"stroke-width":.8});
    dot.append(sv("title",{},`${g.date} ${g.ha==="H"?"vs":"@"} ${g.opp} (${g.sf}:${g.sg} ${g.res})\n${g.comp} · ${g.min}′ · +/- ${fmtPM(g.pm)}`));
    s.append(dot);
  });
  s.append(sv("text",{x:L,y:12,fill:"#9aa4b2","font-size":10},"Tordifferenz während Einsatzzeit, je Spiel"));

    el("span",{},el("span",{class:"sw",style:"background:#4c8bf5"}),"Erwachsenen-Bewerb"),
    el("span",{},el("span",{class:"sw",style:"background:#3fb950"}),"Running Average (5 Spiele, minutengewichtet)"),
    el("span",{},"Punktgröße = Spielminuten")));
}
/* Kohorten-Zeitreihen (kumuliertes roh +/- pro 90) je Geburtsjahrgang, gecacht.
   cat = "Jugend"/"Erwachsen" beschraenkt auf diese Bewerbs-Kategorie (fairer
   Vergleich); Spiele ohne verlaessliches +/- (pm=null) werden ausgelassen. */
let _cohortCache={};
function cohortSeries(by,cat){
  const key=String(by)+"|"+(cat||"alle");
  if(_cohortCache[key])return _cohortCache[key];
  const byr=String(by);
  const rowsBy=new Map();
  for(const p of state.players){
    if(p.birth_year!==byr||!p.player_id)continue;
    if(!rowsBy.has(p.player_id))rowsBy.set(p.player_id,[]);
    rowsBy.get(p.player_id).push(p);
  }
  const series=[];
  rowsBy.forEach(rows=>{
    const gs=playerGames(rows); if(!gs.length)return;
    let cm=0,cp=0; const arr=[];
    gs.forEach(g=>{
      if(g.pm==null)return;               // unvollstaendige Timeline -> auslassen
      if(cat&&g.cat!==cat)return;         // andere Bewerbs-Kategorie -> auslassen
      cm+=g.min;cp+=g.pm;arr.push({iso:g.iso,cumMin:cm,cumPm90:cm?cp/cm*90:0});});
    if(arr.length)series.push(arr);
  });
  _cohortCache[key]=series; return series;
}
/* Werte aller Kohorten-Spieler (cumPm90) zum Stichtag; nur >= minMin kumulierte Minuten */
function cohortValsAt(series,iso,minMin){
  const vals=[];
  for(const arr of series){
    let last=null;
    for(const pt of arr){ if(pt.iso<=iso)last=pt; else break; }
    if(last&&last.cumMin>=(minMin||270))vals.push(last.cumPm90);
  }
  return vals;
}
function quantile(vals,q){
  if(!vals.length)return null;
  const v=[...vals].sort((a,b)=>a-b), idx=(v.length-1)*q,
        lo=Math.floor(idx), hi=Math.ceil(idx);
  return v[lo]+(v[hi]-v[lo])*(idx-lo);
}
/* Rating-Benchmark: sortierte Verteilungen aller Spieler mit >= 270 Min. (gecacht) */
let _ratBench=null,_ratBenchN=-1;
function ratBench(){
  if(_ratBenchN!==state.ratings.length){
    const rows=state.ratings.filter(r=>(+r.minutes||0)>=270);
    _ratBench={n:rows.length};
    ["off","def","total","peak"].forEach(k=>{
      _ratBench[k]=rows.map(r=>+r[k]).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
    });
    _ratBenchN=state.ratings.length;
  }
  return _ratBench;
}
function pctIn(sorted,v){ /* Anteil mit hoeherem Wert -> 0 = bester */
  if(!sorted||!sorted.length)return null;
  let lo=0,hi=sorted.length;
  while(lo<hi){const mid=(lo+hi)>>1; if(sorted[mid]<=v)lo=mid+1; else hi=mid;}
  return 100*(sorted.length-lo)/sorted.length;
}
function pctLabel(p){return p<=5?"herausragend":p<=20?"stark":p<=40?"überdurchschnittlich":
  p<=60?"durchschnittlich":p<=80?"unterdurchschnittlich":"schwach";}

/* Jugend-/Erwachsenen-Minuten aller Kohorten-Spieler eines Jahrgangs (gecacht) */
let _minSplitCache={};
function cohortMinSplit(by){
  const key=String(by);
  if(_minSplitCache[key])return _minSplitCache[key];
  const mm=matchMap(),per=new Map();
  for(const p of state.players){
    if(p.birth_year!==key||!p.player_id)continue;
    const m=mm[String(p.match_id)]; if(!m)continue;
    const mins=+p.minutes||0; if(mins<=0)continue;
    let o=per.get(p.player_id);
    if(!o){o={j:0,e:0,g:0};per.set(p.player_id,o);}
    if(leagueCat(m.competition)==="Jugend")o.j+=mins; else o.e+=mins;
    o.g++;
  }
  const arr=[...per.values()];
  _minSplitCache[key]=arr; return arr;
}

/* SVG: kumuliertes +/- pro 90 des Spielers + mitlaufende Jahrgangs-Referenzlinien.
   `games` muss bereits auf pm!=null gefiltert sein. cat = Bewerbs-Kategorie der
   Referenz (dominante Kategorie des Spielers) fuer einen fairen Vergleich. */
function drawCumChart(host,games,birthYear,cat){
  const W=920,H=300,L=48,R=130,T=18,B=46,n=games.length,MINM=270,COHMIN=20;
  const xs=i=>n>1?L+i*(W-L-R)/(n-1):(L+(W-L-R)/2);
  // Spieler-Kumulation
  let cm=0,cp=0;
  const cum=games.map(g=>{cm+=g.min;cp+=g.pm;return {v:cm?cp/cm*90:0,min:cm};});
  // Kohorten-Linien (Top-20 % = 0.8-Quantil, Median) je Match-Datum
  const series=birthYear?cohortSeries(birthYear,cat):[];
  const th=[],med=[]; let cohortOk=false;
  games.forEach(g=>{
    const vals=cohortValsAt(series,g.iso,MINM);
    if(vals.length>=COHMIN){cohortOk=true;th.push(quantile(vals,0.8));med.push(quantile(vals,0.5));}
    else {th.push(null);med.push(null);}
  });
  // y-Bereich NUR aus dem stabilen Teil (>= MINM kumulierte Minuten) + Referenzen;
  // der verrauschte Anfang wird geclippt statt die Skala zu sprengen.
  const solidStart=cum.findIndex(c=>c.min>=MINM);
  const stable=(solidStart===-1?cum:cum.slice(solidStart)).map(c=>c.v);
  const all=[...(stable.length?stable:cum.map(c=>c.v)),
             ...th.filter(v=>v!=null),...med.filter(v=>v!=null),0];
  let lo=Math.min(...all),hi=Math.max(...all);
  const pad=Math.max(.25,(hi-lo)*.18); lo-=pad; hi+=pad;
  const clip=v=>Math.max(lo+0.02*(hi-lo),Math.min(hi-0.02*(hi-lo),v));
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Kumuliertes Plus-Minus"});
  // Gitter mit "nice" Schrittweite (ca. 4-7 Linien)
  const niceSteps=[0.1,0.2,0.25,0.5,1,2,5];
  const step=niceSteps.find(st=>(hi-lo)/st<=7)||5;
  for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){
    const yy=Y(v);
    s.append(sv("line",{x1:L,y1:yy,x2:W-R,y2:yy,stroke:Math.abs(v)<1e-9?"#2a313d":"#ffffff08","stroke-width":Math.abs(v)<1e-9?1.5:1}));
    s.append(sv("text",{x:L-7,y:yy+4,"text-anchor":"end",fill:"#9aa4b2","font-size":10},fmtPM(v,step<0.25?2:1)));
  }
  // Saisongrenzen
  let lastSeason=null;
  games.forEach((g,i)=>{ if(g.season!==lastSeason){
    if(lastSeason!==null)s.append(sv("line",{x1:xs(i)-3,y1:T,x2:xs(i)-3,y2:H-B,stroke:"#b16286","stroke-width":1,"stroke-dasharray":"3 4"}));
    s.append(sv("text",{x:xs(i),y:H-B+16,"text-anchor":"start",fill:"#b16286","font-size":10},g.season));
    lastSeason=g.season; }});
  // Kohorten-Linien
  const path=(vals)=>vals.map((v,i)=>v==null?null:`${xs(i)},${Y(clip(v))}`).filter(Boolean).join(" ");
  // rechte Rand-Labels sammeln und Kollisionen aufloesen
  const rlabels=[];
  if(cohortOk){
    if(med.some(v=>v!=null))s.append(sv("polyline",{points:path(med),fill:"none",stroke:"#9aa4b2","stroke-width":1.2,"stroke-dasharray":"2 4"}));
    if(th.some(v=>v!=null))s.append(sv("polyline",{points:path(th),fill:"none",stroke:"#d8a12a","stroke-width":2,"stroke-dasharray":"7 4"}));
    const li=th.map((v,i)=>v!=null?i:null).filter(v=>v!=null).pop();
    const mi=med.map((v,i)=>v!=null?i:null).filter(v=>v!=null).pop();
    if(li!=null)rlabels.push({y:Y(clip(th[li])),txt:`Top 20 % Jg. ${birthYear}`,fill:"#d8a12a",size:10});
    if(mi!=null)rlabels.push({y:Y(clip(med[mi])),txt:"Median",fill:"#9aa4b2",size:10});
  }
  // Spieler-Linie: gepunktet solange < MINM kumulierte Minuten, danach durchgezogen
  const seg=(a,b)=>games.slice(a,b+1).map((g,k)=>`${xs(a+k)},${Y(clip(cum[a+k].v))}`).join(" ");
  if(solidStart!==0){
    const end=solidStart===-1?n-1:solidStart;
    s.append(sv("polyline",{points:seg(0,end),fill:"none",stroke:"#3fb950","stroke-width":2.4,"stroke-dasharray":"2 5","stroke-linejoin":"round"}));
  }
  if(solidStart!==-1)
    s.append(sv("polyline",{points:seg(solidStart,n-1),fill:"none",stroke:"#3fb950","stroke-width":2.6,"stroke-linejoin":"round"}));
  // Endwert + Roh-Perzentil
  const fv=cum[n-1].v;
  s.append(sv("circle",{cx:xs(n-1),cy:Y(clip(fv)),r:4,fill:"#3fb950"}));
  let pct=null;
  if(cohortOk){
    const vals=cohortValsAt(series,games[n-1].iso,MINM);
    if(vals.length>=COHMIN)pct=100*vals.filter(v=>v>fv).length/vals.length;
  }
  rlabels.push({y:Y(clip(fv))-4,txt:fmtPM(fv,2)+"/90"+(pct!=null?` · P${pct.toFixed(0)}`:""),
    fill:pct!=null&&pct<=20?"#3fb950":"#e6e9ef",size:12,bold:true});
  // Kollisionen: von oben nach unten mindestens 13px Abstand erzwingen
  rlabels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<rlabels.length;i++)
    if(rlabels[i].y-rlabels[i-1].y<13)rlabels[i].y=rlabels[i-1].y+13;
  rlabels.forEach(lb=>s.append(sv("text",{x:W-R+8,y:lb.y+4,fill:lb.fill,"font-size":lb.size,
    "font-weight":lb.bold?"600":"400"},lb.txt)));
  s.append(sv("text",{x:L,y:12,fill:"#9aa4b2","font-size":10},"kumulierte Tordifferenz pro 90 Minuten (minutengewichtet)"));
  host.append(s);
  const catLab=cat?` (${cat==="Jugend"?"Jugend":"Erwachsenen"}-Bewerbe)`:"";
  host.append(el("div",{class:"legend"},
    el("span",{},el("span",{class:"sw",style:"background:#3fb950"}),"Spieler kumuliert (gepunktet: < 270 Min., noch verrauscht; Anfang ggf. geclippt)"),
    el("span",{},el("span",{class:"sw",style:"background:#d8a12a"}),`Top-20-%-Schwelle Jg.${birthYear?" "+birthYear:""}${catLab}, roh, ≥ 270 Min.`),
    el("span",{},el("span",{class:"sw",style:"background:#9aa4b2"}),"Jahrgangs-Median"+catLab)));
  if(!cohortOk)host.append(el("div",{class:"pf-empty"},birthYear?
    "Zu wenige Jahrgangs-Spieler mit ≥ 270 Minuten für Referenzlinien.":"Kein Geburtsjahr bekannt — keine Jahrgangs-Referenz."));
  return pct;
}

  else head.append(el("div",{class:"pf-foto ph"},"👤"));
  const meta=[];
  if(r0.birth_year)meta.push(`Jahrgang <b>${esc(r0.birth_year)}</b>${r0.age?` (${esc(r0.age)} J.)`:""}`);
  if(r0.nationalitaet)meta.push(`Nationalität <b>${esc(r0.nationalitaet)}</b>`);
  if(r0.verband)meta.push(`Verband <b>${esc(r0.verband)}</b>`);
  if(r0.profil_verein)meta.push(`Verein <b>${esc(r0.profil_verein)}</b>`);
  if(r0.erstes_spiel)meta.push(`erstes Spiel <b>${esc(r0.erstes_spiel)}</b>`);
  if(r0.anzahl_vereine)meta.push(`${esc(r0.anzahl_vereine)} Vereine`);
  const nameCopy=el("button",{class:"copybtn",title:"Namen kopieren"},"⧉");
  nameCopy.onclick=()=>copyText(r0.name,nameCopy);
  const idBox=el("div",{class:"pf-id"},
    el("h2",{},esc(r0.name)," ",
      key.pid?el("a",{class:"ext",href:`https://www.oefb.at/Profile/Spieler/${key.pid}`,target:"_blank",style:"font-size:13px"},"↗ ÖFB"):"",
      " ",nameCopy),
    el("div",{class:"pf-meta",html:meta.join(" · ")}));
  const badges=el("div",{class:"pf-badges"});
  if(+r0.karriere_spiele)badges.append(el("span",{class:"badge"},"Karriere: ",el("b",{},esc(r0.karriere_spiele))," Spiele · ",el("b",{},esc(r0.karriere_tore))," Tore · ",el("b",{},String(Math.round(+r0.karriere_minuten/90)))," Spiele-Äquiv."));
  if(+r0.karriere_gelbe||+r0.karriere_rote)badges.append(el("span",{class:"badge"},`🟨 ${esc(r0.karriere_gelbe||0)} · 🟥 ${+r0.karriere_rote+ +r0.karriere_gelbrote||0}`));
  if(rat&&rat.pct_talent!==""&&!isNaN(+rat.pct_talent))
    badges.append(el("span",{class:"badge"+(+rat.pct_talent<=20?" hl":"")},"Talent-Perzentil ",el("b",{},(+rat.pct_talent).toFixed(1)+" %")," (Jahrgang, Peak+Minuten)"));
  idBox.append(badges);
  // Rating-Einordnung: Wert + Perzentil-Balken + Verbal-Label je Dimension
  if(rat){
    const b=ratBench(), tb2=el("tbody"); let nrows=0;
    [["Offensiv","off",2,"Beitrag zu eigenen Toren"],
     ["Defensiv","def",2,"Verhinderung von Gegentoren"],
     ["Total","total",3,"Off + Def"],
     ["Peak","peak",3,"aufs Leistungshoch projiziert"]].forEach(([lab,k,dec,hint])=>{
      const v=+rat[k], p=pctIn(b[k],v);
      if(p==null||isNaN(v))return;
      nrows++;
      tb2.append(el("tr",{},
        el("td",{},lab),
        el("td",{class:"num",style:"font-weight:600"},fmtPM(v,dec)),
        el("td",{},el("div",{class:"barbg"},el("div",{class:"bar",style:`width:${Math.max(2,100-p)}%`}))),
        el("td",{class:"num",style:p<=20?"color:var(--good);font-weight:600":""},"P"+p.toFixed(0)),
        el("td",{class:"lab"+(p<=20?" good":"")},pctLabel(p)),
        el("td",{class:"lab"},hint)));
    });
    if(nrows){
      const panel=el("div",{class:"bench"},el("table",{},tb2),
        el("div",{class:"expl"},`P = Perzentil unter allen ${b.n} Spielern mit ≥ 270 Min. im Datensatz (0 = bester). `+
          `Off ≈ Beitrag zu eigenen Toren/90, Def ≈ Verhinderung von Gegentoren/90 — mitspieler- und gegner-adjustiert: `+
          `ein starker Def-Wert bedeutet, mit ihm am Feld kassieren seine Teams deutlich weniger, als Mitspieler und Gegner erwarten ließen.`));
      idBox.append(panel);
    }
  }
  head.append(idBox);
  const aiBtn=el("button",{class:"copybtn big",title:"Prompt mit allen Profildaten für eine KI-Zusammenfassung kopieren"},"🤖 KI-Prompt kopieren");
  head.append(aiBtn);
  wrap.append(head);

  // --- Minuten-Split Nachwuchs / Erwachsene (+ Jahrgangs-Vergleich) ---
  const minJ=games.filter(g=>g.cat==="Jugend").reduce((s,g)=>s+g.min,0);
  const minE=games.filter(g=>g.cat==="Erwachsen").reduce((s,g)=>s+g.min,0);
  const tot=minJ+minE;
  const split=r0.birth_year?cohortMinSplit(r0.birth_year):[];
  let subJ="",subE="",subG="";
  if(split.length>=20){
    const jg=r0.birth_year, n=split.length;
    if(minE>0){
      const fewer=split.filter(o=>o.e<minE).length;
      subE=`mehr Herren-Minuten als <b>${(100*fewer/n).toFixed(0)} %</b> des Jg. ${jg}`;
    } else {
      const zero=split.filter(o=>o.e===0).length;
      subE=`wie <b>${(100*zero/n).toFixed(0)} %</b> des Jg. ${jg}: noch 0′ bei den Erwachsenen`;
    }
    const fewerJ=split.filter(o=>o.j<minJ).length;
    subJ=`mehr als <b>${(100*fewerJ/n).toFixed(0)} %</b> des Jahrgangs`;
    subG=`Ø Jahrgang: <b>${(split.reduce((s,o)=>s+o.g,0)/n).toFixed(0)}</b> Einsätze`;
  }
  const card=(val,cls,label,sub)=>{const c=el("div",{class:"pf-card"},
    el("div",{class:"v"+(cls?" "+cls:"")},val),el("div",{class:"l"},label));
    if(sub)c.append(el("div",{class:"sub",html:sub})); return c;};
  const cards=el("div",{class:"pf-cards"},
    card(minJ+"′","cat-j","Minuten Nachwuchs",subJ),
    card(minE+"′","cat-e","Minuten Erwachsene",subE),
    card(String(games.length),"","Einsätze (im Datensatz)",subG),
    card(String(games.reduce((s,g)=>s+g.goals,0)),"","Tore (im Datensatz)",""));
  wrap.append(cards);
  if(tot>0){
    wrap.append(el("div",{class:"pf-splitbar"},
      el("div",{style:`width:${100*minJ/tot}%;background:#d29922`}),
      el("div",{style:`width:${100*minE/tot}%;background:#4c8bf5`})));
    wrap.append(el("div",{class:"meta"},`Nachwuchs ${(100*minJ/tot).toFixed(0)} % · Erwachsene ${(100*minE/tot).toFixed(0)} % — Basis: gescrapte Bewerbe seit 2023/24`));
  }

  // --- Saison-Tabelle (Spiele ohne verlaessliche Tor-Timeline: nicht im +/-) ---
  const vgames=games.filter(g=>g.pm!=null);
  const nExcl=games.length-vgames.length;
  wrap.append(el("h3",{},"Saisonen ",el("small",{},"(aus den gescrapten Bewerben; roh +/- = Tordifferenz während Einsatzzeit)")));
  const bySea=new Map();
  games.forEach(g=>{ if(!bySea.has(g.season))bySea.set(g.season,{games:0,min:0,goals:0,pm:0,pmMin:0,pmGames:0,teams:new Set(),comps:new Set()});
    const o=bySea.get(g.season); o.games++;o.min+=g.min;o.goals+=g.goals;
    if(g.pm!=null){o.pm+=g.pm;o.pmMin+=g.min;o.pmGames++;}
    o.teams.add(g.team);o.comps.add(g.comp);});
  const st=el("table"),stb=el("tbody");
  st.append(el("thead",{},el("tr",{},...["Saison","Team","Bewerb","Spiele","Minuten","Tore","+/-","+/- pro 90"].map((h,i)=>el("th",{style:"position:static;"+(i>2?"text-align:right":"")},h)))));
  const seaRow=(sea,o,bold)=>{
    const pm90=o.pmMin?o.pm/o.pmMin*90:null;
    return el("tr",{style:bold?"font-weight:600;border-top:2px solid var(--line)":""},
      el("td",{},sea),el("td",{},bold?"":[...o.teams].join(", ")),
      el("td",{},...(bold?[]:[...o.comps].map(c=>el("span",{class:"tag",style:"margin-right:4px"},c)))),
      el("td",{class:"num"},String(o.games)),el("td",{class:"num"},o.min+"′"),
      el("td",{class:"num"},String(o.goals)),
      el("td",{class:"num "+(o.pmGames?pmClass(o.pm):"")},o.pmGames?fmtPM(o.pm):"—"),
      el("td",{class:"num "+(pm90!=null?pmClass(pm90):"")},pm90!=null?fmtPM(pm90,2):"—"));
  };
  [...bySea.entries()].sort((a,b)=>a[0]<b[0]?1:-1).forEach(([sea,o])=>stb.append(seaRow(sea,o)));
  // Gesamt-Zeile = identisch mit dem Endwert des Akkumulations-Charts
  const tot0={games:games.length,min:games.reduce((s,g)=>s+g.min,0),
    goals:games.reduce((s,g)=>s+g.goals,0),pm:vgames.reduce((s,g)=>s+g.pm,0),
    pmMin:vgames.reduce((s,g)=>s+g.min,0),pmGames:vgames.length,teams:new Set(),comps:new Set()};
  stb.append(seaRow("Gesamt",tot0,true));
  st.append(stb); wrap.append(st);
  if(nExcl>0)wrap.append(el("div",{class:"pf-empty"},
    `${nExcl} Einsatz${nExcl>1?"e":""} ohne vollständige Tor-Minuten in der Quelle — nicht im +/- enthalten (Minuten/Tore zählen trotzdem).`));

  // --- +/- akkumuliert (Haupt-Chart; Referenz = dominante Bewerbs-Kategorie) ---
  const domCat=tot>0?(minE>=minJ?"Erwachsen":"Jugend"):null;
  let cumPct=null;
  wrap.append(el("h3",{},"Plus-Minus akkumuliert ",el("small",{},"— mit Top-20-%-Schwelle des Jahrgangs")));
  if(vgames.length>=2){ const viz=el("div",{class:"viz"}); cumPct=drawCumChart(viz,vgames,r0.birth_year||null,domCat); wrap.append(viz);
    wrap.append(el("div",{class:"note",html:"<b>Lesehilfe:</b> Die grüne Linie ist das <b>kumulierte rohe +/- pro 90</b> — sie stabilisiert sich mit wachsender Spielzeit. Die goldene Linie ist die <b>Top-20-%-Schwelle des Geburtsjahrgangs</b> (gleiche Roh-Metrik, nur Spieler mit ≥ 270 Min.): liegt die grüne Linie darüber, gehört der Spieler nach rohem +/- zu den Top 20 % seines Jahrgangs. Achtung: roh = <b>nicht</b> gegner-adjustiert — das Modell-Rating oben (Badge, inkl. Talent-Perzentil) adjustiert für Mit- und Gegenspieler. Weichen beide ab, lohnt der Blick in die Match-Tabelle (Gegner, Bewerb, Liga-Level)."}));
  } else wrap.append(el("div",{class:"pf-empty"},"Zu wenige Einsätze für einen Verlauf."));

  // --- Match-Kontext ---
  wrap.append(el("h3",{},"Alle Einsätze ",el("small",{},`(${games.length})`)));
  const mt=el("table"),mtb=el("tbody");
  mt.append(el("thead",{},el("tr",{},...["Datum","Bewerb","Team","","Gegner","Ergebnis","Min.","Tore","+/-"].map((h,i)=>el("th",{style:"position:static;"+(i>5?"text-align:right":"")},h)))));
  [...games].reverse().forEach(g=>{
    mtb.append(el("tr",{},
      el("td",{},g.date),el("td",{},el("span",{class:"tag "+(g.cat==="Jugend"?"cat-j":"cat-e")},g.comp)),
      el("td",{},g.team),el("td",{style:"color:var(--muted)"},g.ha),
      el("td",{},g.opp),
      el("td",{class:"score",title:"Original (Heim:Gast): "+g.score},`${g.sf}:${g.sg}`,el("span",{class:"res res-"+g.res},g.res)),
      el("td",{class:"num",title:g.on||g.off!=null?`${g.on||0}′–${g.off==null?90:g.off}′`:""},g.min+"′"),
      el("td",{class:"num"},g.goals?String(g.goals):"·"),
      el("td",{class:"num "+(g.pm!=null?pmClass(g.pm):""),
        title:g.pm==null?"Tor-Minuten in der Quelle unvollständig":""},
        g.pm!=null?fmtPM(g.pm):"—")));
  });
  mt.append(mtb); wrap.append(mt);

  // --- Vereins-Historie & Erfolge (extras, lazy) ---
  const ex=key.pid&&state.extras?state.extras[key.pid]:null;
  if(ex&&(ex.v||[]).length){
    wrap.append(el("h3",{},"Vereins-Historie ",el("small",{},"(ÖFB-Profil, gesamte Karriere)")));
    const vt=el("table"),vtb=el("tbody");
    vt.append(el("thead",{},el("tr",{},...["ab","Verein",""].map(h=>el("th",{style:"position:static"},h)))));
    [...ex.v].sort((a,b)=>(b[1]||0)-(a[1]||0)).forEach(v=>{
      const d=v[1]?new Date(v[1]).toLocaleDateString("de-AT",{year:"numeric",month:"short"}):"—";
      vtb.append(el("tr",{},el("td",{class:"num",style:"white-space:nowrap"},d),el("td",{},esc(v[0])),
        el("td",{style:"color:var(--muted)"},v[2]&&v[2]!=="at"?String(v[2]).toUpperCase():"")));
    });
    vt.append(vtb); wrap.append(vt);
  }
  if(ex&&(ex.e||[]).length){
    wrap.append(el("h3",{},"Saison-Historie ",el("small",{},"(ÖFB-Profil: Kader & Platzierungen, gesamte Karriere)")));
    const et=el("table"),etb=el("tbody");
    et.append(el("thead",{},el("tr",{},...["Saison","Verein","Kategorie","Platzierung"].map(h=>el("th",{style:"position:static"},h)))));
    [...ex.e].sort((a,b)=>String(b[0]).localeCompare(String(a[0]))).forEach(e2=>{
      etb.append(el("tr",{},el("td",{},esc(e2[0])),el("td",{},esc(e2[1])),
        el("td",{},el("span",{class:"tag"},esc(e2[2]))),el("td",{},esc(e2[3]))));
    });
    et.append(etb); wrap.append(et);
  }
  if(key.pid&&!state.extras&&!location.protocol.startsWith("file"))
    wrap.append(el("div",{class:"pf-empty"},"Vereins-/Saison-Historie lädt…"));

  // --- Detail-Chart (Rohwerte je Spiel) ganz am Ende ---
  if(vgames.length>=2){
    wrap.append(el("h3",{},"Detail: +/- je Spiel ",el("small",{},"(Rohwerte + Running Average)")));
    const viz2=el("div",{class:"viz"}); drawPMChart(viz2,vgames); wrap.append(viz2);
  }

  // --- KI-Prompt: alle sichtbaren Profildaten als Scouting-Prompt ---
  const strip=s=>String(s==null?"":s).replace(/<[^>]+>/g,"");
  function buildProfilePrompt(){
    const L=[];
    L.push("Du bist ein erfahrener Fußball-Scout für den österreichischen Nachwuchs- und Amateurfußball.");
    L.push("Erstelle aus den folgenden Daten eine prägnante Scouting-Einschätzung des Spielers:");
    L.push("Stärken/Schwächen, Entwicklung über die Saisonen, Einordnung im Jahrgang, Kontext (Liga-Level, Team), und eine kurze Empfehlung. Weise auf Unsicherheiten hin (z. B. wenige Minuten).");
    L.push("");
    L.push("## Methodik (wichtig fürs Lesen der Zahlen)");
    L.push("- Modell-Rating = Regularized Adjusted Plus-Minus (Tore/90): Beitrag des Spielers zur Tordifferenz, adjustiert für Mit- und Gegenspieler. 0 = Durchschnittsspieler. Off ≈ Beitrag zu eigenen Toren, Def ≈ Verhinderung von Gegentoren, Peak = aufs Leistungshoch (~26 J.) projiziert.");
    L.push("- Perzentile: 0 = bester (P10 = Top 10 %).");
    L.push("- Roh-+/- = Tordifferenz des TEAMS während der Einsatzzeit des Spielers (NICHT adjustiert — enthält Teamstärke/Liga-Kontext). Abweichung roh vs. Modell ist informativ.");
    L.push("");
    L.push("## Stammdaten");
    L.push(`Name: ${r0.name}`);
    if(r0.birth_year)L.push(`Jahrgang: ${r0.birth_year}${r0.age?` (${r0.age} J.)`:""}`);
    if(r0.nationalitaet)L.push(`Nationalität: ${r0.nationalitaet}`);
    if(r0.verband)L.push(`Landesverband: ${r0.verband}`);
    if(r0.profil_verein)L.push(`Aktueller Verein: ${r0.profil_verein}`);
    if(r0.erstes_spiel)L.push(`Erstes Spiel (ÖFB): ${r0.erstes_spiel}`);
    if(r0.anzahl_vereine)L.push(`Anzahl Vereine: ${r0.anzahl_vereine}`);
    if(+r0.karriere_spiele)L.push(`ÖFB-Karriere gesamt: ${r0.karriere_spiele} Spiele, ${r0.karriere_tore} Tore, ${r0.karriere_minuten} Minuten, ${r0.karriere_gelbe||0} Gelbe, ${(+r0.karriere_rote||0)+(+r0.karriere_gelbrote||0)} Rote`);
    if(rat){
      const bb=ratBench();
      L.push("");
      L.push(`## Modell-Rating (vs. alle ${bb.n} Spieler ≥ 270 Min. im Datensatz)`);
      [["Offensiv","off",2],["Defensiv","def",2],["Total","total",3],["Peak","peak",3]].forEach(([lab,k,dec])=>{
        const v=+rat[k],p=pctIn(bb[k],v);
        if(p!=null&&!isNaN(v))L.push(`${lab}: ${fmtPM(v,dec)} — P${p.toFixed(0)} (${pctLabel(p)})`);
      });
      if(rat.pct_talent!==""&&!isNaN(+rat.pct_talent))
        L.push(`Talent-Perzentil im Jahrgang (Peak+Minuten kombiniert): ${(+rat.pct_talent).toFixed(1)} %`);
    }
    L.push("");
    L.push("## Minuten (im Datensatz, Saisonen 2023/24–2025/26)");
    L.push(`Nachwuchs-Bewerbe: ${minJ}′${subJ?` (${strip(subJ)})`:""}`);
    L.push(`Erwachsenen-Bewerbe: ${minE}′${subE?` (${strip(subE)})`:""}`);
    L.push(`Einsätze: ${games.length}${subG?` (${strip(subG)})`:""} · Tore: ${games.reduce((s,g)=>s+g.goals,0)}`);
    L.push("");
    L.push("## Saisonen (roh +/- = Team-Tordifferenz während Einsatzzeit)");
    L.push("Saison | Team | Bewerb | Spiele | Minuten | Tore | +/- | +/- pro 90");
    [...bySea.entries()].sort((a,b)=>a[0]<b[0]?1:-1).forEach(([sea,o])=>{
      const pm90=o.pmMin?(o.pm/o.pmMin*90):null;
      L.push(`${sea} | ${[...o.teams].join(", ")} | ${[...o.comps].join(", ")} | ${o.games} | ${o.min}′ | ${o.goals} | ${o.pmGames?fmtPM(o.pm):"—"} | ${pm90!=null?fmtPM(pm90,2):"—"}`);
    });
    const g90=tot0.pmMin?tot0.pm/tot0.pmMin*90:null;
    L.push(`GESAMT | | | ${tot0.games} | ${tot0.min}′ | ${tot0.goals} | ${tot0.pmGames?fmtPM(tot0.pm):"—"} | ${g90!=null?fmtPM(g90,2):"—"}`);
    if(g90!=null)L.push(`Kumuliertes roh-+/- pro 90: ${fmtPM(g90,2)}${cumPct!=null?` — Perzentil P${cumPct.toFixed(0)} im Jahrgang${domCat?` (${domCat==="Jugend"?"Jugend":"Erwachsenen"}-Bewerbe, roh)`:""}`:""}`);
    if(nExcl>0)L.push(`Hinweis: ${nExcl} Einsätze ohne vollständige Tor-Minuten in der Quelle — nicht im +/- enthalten.`);
    L.push("");
    L.push(`## Alle Einsätze (${games.length}, neueste zuerst; Ergebnis aus Team-Sicht, S/U/N)`);
    L.push("Datum | Bewerb | H/A | Gegner | Ergebnis | Min | Tore | +/-");
    [...games].reverse().forEach(g=>{
      L.push(`${g.date} | ${g.comp} | ${g.ha} | ${g.opp} | ${g.sf}:${g.sg} ${g.res} | ${g.min}′ | ${g.goals||0} | ${g.pm!=null?fmtPM(g.pm):"—"}`);
    });
    if(ex&&(ex.v||[]).length){
      L.push(""); L.push("## Vereins-Historie (gesamte Karriere)");
      [...ex.v].sort((a,b)=>(b[1]||0)-(a[1]||0)).forEach(v=>{
        const d=v[1]?new Date(v[1]).toLocaleDateString("de-AT",{year:"numeric",month:"short"}):"—";
        L.push(`ab ${d}: ${v[0]}${v[2]&&v[2]!=="at"?" ("+String(v[2]).toUpperCase()+")":""}`);
      });
    }
    if(ex&&(ex.e||[]).length){
      L.push(""); L.push("## Saison-Historie (Kader & Platzierungen, gesamte Karriere)");
      [...ex.e].sort((a,b)=>String(b[0]).localeCompare(String(a[0]))).forEach(e2=>{
        L.push(`${e2[0]} | ${e2[1]} | ${e2[2]} | ${e2[3]}`);
      });
    }
    return L.join("\n");
  }
  aiBtn.onclick=()=>copyText(buildProfilePrompt(),aiBtn);
  state._promptFn=buildProfilePrompt;   // fuer Tests/Debugging
}

const SVGNS="http://www.w3.org/2000/svg";
function sv(t,a={},...k){const e=document.createElementNS(SVGNS,t);
  for(const key in a)e.setAttribute(key,a[key]);
  k.forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c)));return e;}

const AGE_CURVE=[[13,-0.42],[14,-0.36],[15,-0.31],[16,-0.26],[17,-0.20],[18,-0.15],
  [19,-0.09],[20,-0.04],[21,-0.01],[22,0.01],[23,0.03],[24,0.05],[25,0.06],[26,0.06],
  [27,0.06],[28,0.05],[29,0.03],[30,0.01],[31,-0.02],[32,-0.06],[33,-0.10],[34,-0.15],
  [35,-0.21],[36,-0.27],[37,-0.34],[38,-0.40],[39,-0.46],[40,-0.52]];

function drawTimeline(host){
  const W=640,H=180,L=48,R=16,x=m=>L+m/90*(W-L-R);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Spiel in Segmente geteilt"});
  const lanes=[{y:44,lab:"Heim",cls:"t-off"},{y:118,lab:"Gast",cls:"t-def"}];
  // Segment-Hintergründe
  [[0,60,"S1 (0–60′)"],[60,90,"S2 (60–90′)"]].forEach(([a,b,lab],i)=>{
    s.append(sv("rect",{x:x(a),y:28,width:x(b)-x(a),height:130,rx:6,
      fill:i%2?"#ffffff08":"#ffffff05",stroke:"#2a313d"}));
    s.append(sv("text",{x:(x(a)+x(b))/2,y:20,"text-anchor":"middle",fill:"#9aa4b2","font-size":12},lab));
  });
  // Wechsel-Linie
  s.append(sv("line",{x1:x(60),y1:26,x2:x(60),y2:160,stroke:"#b16286","stroke-width":1.5,"stroke-dasharray":"4 3"}));
  s.append(sv("text",{x:x(60),y:172,"text-anchor":"middle",fill:"#b16286","font-size":11},"🔁 Wechsel 60′"));
  // Lanes + Spieler
  const chips={"Heim":[["A B C",30],["A B C₂",75]],"Gast":[["D E F",30],["D E F",75]]};
  lanes.forEach(ln=>{
    s.append(sv("text",{x:6,y:ln.y+4,fill:"#e6e9ef","font-size":12,"font-weight":600},ln.lab));
    chips[ln.lab].forEach(([txt,mm])=>{
      const cx=x(mm);
      s.append(sv("rect",{x:cx-34,y:ln.y-14,width:68,height:26,rx:13,fill:"#1f242e",stroke:"#2a313d"}));
      s.append(sv("text",{x:cx,y:ln.y+3,"text-anchor":"middle",fill:"#e6e9ef","font-size":12},txt));
    });
  });
  // Tore
  [[25,44,"⚽"],[72,118,"⚽"]].forEach(([m,y,ic])=>
    s.append(sv("text",{x:x(m),y:y-20,"text-anchor":"middle","font-size":15},ic)));
  // Achse
  s.append(sv("line",{x1:L,y1:158,x2:W-R,y2:158,stroke:"#2a313d"}));
  [0,45,90].forEach(t=>s.append(sv("text",{x:x(t),y:172,"text-anchor":"middle",fill:"#9aa4b2","font-size":10},t+"′")));
  host.append(s);
}

function drawMatrix(host){
  const PL=["A","B","C","C₂","D","E","F"], nP=PL.length;
  const cs=24, x0=70, y0=44, rowH=26;
  const cols=nP*2+2;                 // Off(7) + Def(7) + c + h
  const W=x0+cols*cs+70, H=y0+4*rowH+16;
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Design-Matrix"});
  const cx=i=>x0+i*cs+cs/2;
  // Gruppen-Header
  const grp=(a,b,lab,col)=>{s.append(sv("text",{x:(cx(a)+cx(b))/2,y:14,"text-anchor":"middle",fill:col,"font-size":11},lab));};
  grp(0,nP-1,"Offensiv βᴼ","#3fb950"); grp(nP,2*nP-1,"Defensiv βᴰ","#f0836b");
  s.append(sv("text",{x:cx(2*nP)+cs/2,y:14,"text-anchor":"middle",fill:"#9aa4b2","font-size":11},"Zusatz"));
  // Spalten-Labels
  const labels=[...PL,...PL,"c","h"];
  labels.forEach((l,i)=>s.append(sv("text",{x:cx(i),y:34,"text-anchor":"middle",fill:"#9aa4b2","font-size":11},l)));
  s.append(sv("text",{x:x0+cols*cs+36,y:34,"text-anchor":"middle",fill:"#4c8bf5","font-size":11},"y"));
  // Zeilen (Beobachtungen): [homeOff?, homeSet, awaySet, y, hfa]
  const P={A:0,B:1,C:2,"C₂":3,D:4,E:5,F:6};
  const rows=[
    {lab:"S1·Heim ▶",off:["A","B","C"],opp:["D","E","F"],hfa:1,y:1},
    {lab:"S1·Gast ▶",off:["D","E","F"],opp:["A","B","C"],hfa:0,y:0},
    {lab:"S2·Heim ▶",off:["A","B","C₂"],opp:["D","E","F"],hfa:1,y:0},
    {lab:"S2·Gast ▶",off:["D","E","F"],opp:["A","B","C₂"],hfa:0,y:1},
  ];
  rows.forEach((r,ri)=>{
    const yy=y0+ri*rowH;
    s.append(sv("text",{x:64,y:yy+rowH/2+4,"text-anchor":"end",fill:"#e6e9ef","font-size":11},r.lab));
    const cell=(ci,val)=>{
      const fill=val>0?"#3fb95033":val<0?"#f0836b33":"#ffffff06";
      const stroke=val>0?"#3fb95088":val<0?"#f0836b88":"#2a313d";
      s.append(sv("rect",{x:x0+ci*cs+1,y:yy+1,width:cs-2,height:rowH-2,rx:4,fill,stroke}));
      if(val)s.append(sv("text",{x:cx(ci),y:yy+rowH/2+4,"text-anchor":"middle",
        fill:val>0?"#3fb950":"#f0836b","font-size":12},val>0?"+1":"−1"));
    };
    for(let i=0;i<cols;i++)cell(i,0);
    r.off.forEach(p=>cell(P[p],1));                 // eigener Angriff -> Offensiv +1
    r.opp.forEach(p=>cell(nP+P[p],-1));             // Gegner -> Defensiv −1
    cell(2*nP,1);                                   // c
    if(r.hfa)cell(2*nP+1,1);                         // h nur für Heim
    // y-Wert
    s.append(sv("text",{x:x0+cols*cs+36,y:yy+rowH/2+4,"text-anchor":"middle",fill:"#4c8bf5","font-size":13,"font-weight":600},r.y));
  });
  host.append(s);
}

function drawAgeCurve(host){
  const W=640,H=250,L=46,R=18,T=16,B=34;
  const xs=13,xe=40,ymin=-0.56,ymax=0.12;
  const X=a=>L+(a-xs)/(xe-xs)*(W-L-R), Y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Alterskurve"});
  // Achsen / Nulllinie
  s.append(sv("line",{x1:L,y1:Y(0),x2:W-R,y2:Y(0),stroke:"#2a313d","stroke-dasharray":"4 3"}));
  s.append(sv("text",{x:L-6,y:Y(0)+4,"text-anchor":"end",fill:"#9aa4b2","font-size":10},"0,0"));
  [-0.2,-0.4].forEach(v=>{s.append(sv("line",{x1:L,y1:Y(v),x2:W-R,y2:Y(v),stroke:"#ffffff08"}));
    s.append(sv("text",{x:L-6,y:Y(v)+4,"text-anchor":"end",fill:"#9aa4b2","font-size":10},String(v).replace(".",",")));});
  [14,18,22,26,30,34,38].forEach(a=>s.append(sv("text",{x:X(a),y:H-14,"text-anchor":"middle",fill:"#9aa4b2","font-size":10},a+"J")));
  // Kurve
  const pts=AGE_CURVE.map(([a,v])=>`${X(a)},${Y(v)}`).join(" ");
  s.append(sv("polyline",{points:pts,fill:"none",stroke:"#4c8bf5","stroke-width":2.5}));
  // Peak
  const peak=AGE_CURVE.reduce((m,p)=>p[1]>m[1]?p:m);
  s.append(sv("circle",{cx:X(peak[0]),cy:Y(peak[1]),r:4,fill:"#3fb950"}));
  s.append(sv("text",{x:X(peak[0]),y:Y(peak[1])-10,"text-anchor":"middle",fill:"#3fb950","font-size":11},"Leistungshoch ≈ "+peak[0]));
  // Peak-Zuschlag-Pfeil bei Alter 17
  const a0=17,v0=AGE_CURVE.find(p=>p[0]===a0)[1];
  s.append(sv("line",{x1:X(a0),y1:Y(v0),x2:X(a0),y2:Y(peak[1]),stroke:"#d8a12a","stroke-width":1.5,"stroke-dasharray":"3 2"}));
  s.append(sv("circle",{cx:X(a0),cy:Y(v0),r:3,fill:"#d8a12a"}));
  s.append(sv("text",{x:X(a0)+6,y:(Y(v0)+Y(peak[1]))/2,fill:"#d8a12a","font-size":10},"Peak-Zuschlag"));
  s.append(sv("text",{x:X(16),y:Y(-0.5),"text-anchor":"middle",fill:"#9aa4b2","font-size":10},"jung → verbessert sich"));
  s.append(sv("text",{x:X(36),y:Y(0.08),"text-anchor":"middle",fill:"#9aa4b2","font-size":10},"älter → lässt nach"));
  host.append(s);
}

function drawFunnel(host){
  const W=640,H=120,N=20,L=20,R=20,gap=(W-L-R)/(N-1);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Talent-Filter"});
  s.append(sv("text",{x:L,y:16,fill:"#9aa4b2","font-size":11},"Ein Jahrgang – nach Peak-Rating sortiert (bester links)"));
  const cut=Math.round(N*0.2);
  for(let i=0;i<N;i++){
    const cxp=L+i*gap, top=i<cut;
    s.append(sv("circle",{cx:cxp,cy:60,r:top?9:6,fill:top?"#3fb950":"#1f242e",stroke:top?"#3fb950":"#2a313d","stroke-width":1.5}));
  }
  // Klammer über Top 20 %
  const x1=L-9,x2=L+(cut-1)*gap+9;
  s.append(sv("path",{d:`M${x1} 40 v-6 h${x2-x1} v6`,fill:"none",stroke:"#3fb950","stroke-width":1.5}));
  s.append(sv("text",{x:(x1+x2)/2,y:26,"text-anchor":"middle",fill:"#3fb950","font-size":11,"font-weight":600},"Top 20 % → Shortlist"));
  s.append(sv("text",{x:L,y:96,fill:"#9aa4b2","font-size":11},"+ Mindestminuten-Schwelle: dämpft Zufall bei Spielern mit wenig Einsatzzeit"));
  host.append(s);
}

function renderExplain(){
  const sec=$("#tab-explain");
  sec.innerHTML=`
  <div class="explain">
    <p class="lead"><b>Plus-Minus (PM)</b> ist ein Top-down-Rating: Man beobachtet nur das
      Teamergebnis (Tore) und verteilt Verdienst/Schuld auf die Spieler auf dem Feld –
      <b>adjustiert für Mit- und Gegenspieler</b>. Jeder Spieler bekommt ein Offensiv- und ein
      Defensiv-Rating; ihre Summe ist das <b>Total-Rating</b>.</p>
    <p class="cite">Methodik: Hvattum (2020, <i>Applied Sciences</i>) &amp; Hvattum, Kriegl &amp; Čulík (2021),
      „Identifying talent in association football through plus-minus ratings".</p>

    <div class="step"><div class="n">1</div><div class="body">
      <h3>Vom Spiel zu Segmenten</h3>
      <p>Jedes Spiel wird an jeder <b>Ein-/Auswechslung</b> und jeder <b>Roten Karte</b> in
        <b>Segmente</b> mit unveränderter Aufstellung geschnitten. Pro Segment kennt man Dauer,
        die anwesenden Spieler und die Tore je Team.</p>
      <div class="viz"><div id="viz-timeline"></div>
        <div class="legend">
          <span><span class="sw" style="background:#1f242e;border:1px solid #2a313d"></span>Spieler auf dem Feld</span>
          <span>⚽ Tor</span><span>🔁 Wechsel = neue Segmentgrenze</span></div></div>
    </div></div>

    <div class="step"><div class="n">2</div><div class="body">
      <h3>Zwei Perspektiven je Segment <span style="color:var(--muted);font-weight:400;font-size:13px">(Ilardi 2007)</span></h3>
      <p>Jedes Segment liefert <b>zwei Beobachtungen</b>: einmal <span class="t-off">Heim in der
        Offensive</span> (wie viele Tore erzielt Heim?) und einmal <span class="t-def">Gast in der
        Offensive</span>. Dadurch lassen sich Angriff und Abwehr <b>getrennt</b> schätzen.</p>
    </div></div>

    <div class="step"><div class="n">3</div><div class="body">
      <h3>Die Grundgleichung</h3>
      <p>Die erwarteten Tore eines Teams im Segment ≈ Summe der eigenen Offensiv-Ratings minus
        Summe der gegnerischen Defensiv-Ratings, skaliert mit der Segmentdauer:</p>
      <div class="eq">
        g<sup>H</sup> ≈ <span class="frac"><span>d</span><span class="den">90</span></span>
        · ( c + <span class="t-hfa">h</span>
        + <span class="t-off"><span class="big">Σ</span><sub>i∈Heim</sub> β<sup>O</sup><sub>i</sub></span>
        − <span class="t-def"><span class="big">Σ</span><sub>j∈Gast</sub> β<sup>D</sup><sub>j</sub></span>
        + <span class="t-man">μ·(n<sub>H</sub>−n<sub>A</sub>)</span> )
        <small>für die Gasttore symmetrisch – mit den Gast-Offensiv- und Heim-Defensiv-Ratings, ohne Heimvorteil <span class="t-hfa">h</span>.</small>
      </div>
      <table class="symtab">
        <tr><td>β<sup>O</sup><sub>i</sub>, β<sup>D</sup><sub>i</sub></td><td>Offensiv- / Defensiv-Rating von Spieler i (Tore pro 90 min)</td></tr>
        <tr><td>d</td><td>Segmentdauer in Minuten</td></tr>
        <tr><td>c</td><td>Grund-Torrate (Basiswert)</td></tr>
        <tr><td class="t-hfa">h</td><td>Heimvorteil</td></tr>
        <tr><td class="t-man">μ, n<sub>H</sub>/n<sub>A</sub></td><td>Über-/Unterzahl-Effekt bzw. Spielerzahl je Team (Rote Karten)</td></tr>
      </table>
    </div></div>

    <div class="step"><div class="n">4</div><div class="body">
      <h3>Die Design-Matrix</h3>
      <p>Alle Beobachtungen ergeben ein Gleichungssystem <span class="eq" style="display:inline-block;padding:2px 8px;font-size:15px">y = X·β + ε</span>.
        Zeilen = Beobachtungen, Spalten = alle Spieler (ein <span class="t-off">Offensiv-</span> und ein
        <span class="t-def">Defensiv-Block</span>) plus Zusatzterme. <span class="t-off">+1</span> = Spieler im
        eigenen Angriff, <span class="t-def">−1</span> = Gegenspieler in der Abwehr. Die Matrix ist
        <b>dünn besetzt</b> (Beispiel: Heim A,B,C – Gast D,E,F, Wechsel C→C₂ bei 60′).</p>
      <div class="viz"><div id="viz-matrix"></div>
        <div class="legend">
          <span><span class="sw" style="background:#3fb95033;border:1px solid #3fb950"></span>+1 eigener Angriff</span>
          <span><span class="sw" style="background:#f0836b33;border:1px solid #f0836b"></span>−1 Gegner (Abwehr)</span>
          <span><span class="sw" style="background:#4c8bf5"></span>y = erzielte Tore</span></div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0">Werte zusätzlich mit d/90 skaliert; der Über-/Unterzahl-Term μ ist hier 0 (keine Rote Karte).</p></div>
    </div></div>

    <div class="step"><div class="n">5</div><div class="body">
      <h3>Regularisierte Schätzung (Ridge)</h3>
      <p>Die Ratings β minimieren die gewichtete quadratische Abweichung zwischen beobachteten und
        modellierten Toren – plus einen <b>Strafterm</b>, der Ratings gegen 0 (Durchschnittsspieler) zieht:</p>
      <div class="eq">
        min<sub>β</sub> &nbsp;<span class="big">Σ</span><sub>m,s</sub>
        w·( <span class="t-off">f<sup>H</sup></span> − g<sup>H</sup> )²
        + w·( <span class="t-def">f<sup>A</sup></span> − g<sup>A</sup> )²
        + <span class="t-reg">λ <span class="big">Σ</span><sub>k</sub> β<sub>k</sub>²</span>
      </div>
      <div class="eq">
        β = ( X<sup>T</sup>W X + <span class="t-reg">λ</span> I )<sup>−1</sup> X<sup>T</sup>W y
      </div>
      <div class="note"><b>Warum die Regularisierung?</b> Ein Spieler mit wenigen Minuten hat kaum
        Datenpunkte – <b>λ</b> hält sein Rating dann nahe 0, statt ihm ein zufälliges Extrem
        zuzuweisen. w gewichtet Segmente (Dauer, Aktualität, Spielstand). λ wird per
        Cross-Validation gewählt (im Datensatz: λ≈30).</div>
    </div></div>

    <div class="step"><div class="n">6</div><div class="body">
      <h3>Alterskurve &amp; Peak-Rating</h3>
      <p>Ratings sind <b>keine Konstante</b>, sondern altersabhängig: junge Spieler verbessern sich,
        erreichen ein Hoch und lassen später nach. Aus dem aktuellen Total-Rating und der Alterskurve
        wird ein <b>Peak-Rating</b> projiziert – so werden junge und reife Spieler vergleichbar.</p>
      <div class="viz"><div id="viz-agecurve"></div></div>
      <div class="eq">
        peak = total + ( c<sub>max</sub> − c(Alter) ),
        &nbsp; total = <span class="t-off">β<sup>O</sup></span> + <span class="t-def">β<sup>D</sup></span>
        <small>c(·) ist die Alterskurve; c<sub>max</sub> ihr Wert im Leistungshoch (≈ 26 J.).</small>
      </div>
    </div></div>

    <div class="step"><div class="n">7</div><div class="body">
      <h3>Vom Rating zum Talent-Filter</h3>
      <p>Spieler werden <b>je Geburtsjahrgang</b> in Perzentile gerankt. Ein Cut-off (z. B. Top 20 %)
        bildet die Scouting-Shortlist. Da junge Spieler mit wenig Minuten verrauschte Ratings haben,
        wird zusätzlich die <b>Spielzeit</b> einbezogen (Peak-Rating + Minuten).</p>
      <div class="viz"><div id="viz-funnel"></div></div>
      <div class="note">Kategorien: <b>Early developer</b> (&lt;17 erkannt), <b>Late developer</b> (17–20),
        <b>Grassroots</b> (erst &gt;20 in den Daten). Ergebnis im Paper: mit „Peak + Minuten, Top 20 %"
        werden ~<b>80 %</b> der später wertvollsten Spieler früh erkannt. → siehe Tab <b>Ratings</b>
        (Spalte „Talent %").</div>
    </div></div>
  </div>`;
  drawTimeline($("#viz-timeline"));
  drawMatrix($("#viz-matrix"));
  drawAgeCurve($("#viz-agecurve"));
  drawFunnel($("#viz-funnel"));
}
