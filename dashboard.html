  // Kurve
  const pts=AGE_CURVE.map(([a,v])=>`${X(a)},${Y(v)}`).join(" ");
  s.append(sv("polyline",{points:pts,fill:"none",stroke:"#00B3F0","stroke-width":2.5}));
  // Peak
  const peak=AGE_CURVE.reduce((m,p)=>p[1]>m[1]?p:m);
  s.append(sv("circle",{cx:X(peak[0]),cy:Y(peak[1]),r:4,fill:"#34B190"}));
  s.append(sv("text",{x:X(peak[0]),y:Y(peak[1])-10,"text-anchor":"middle",fill:"#34B190","font-size":11},TX("Leistungshoch ≈ ","Peak ≈ ")+peak[0]));
  // Peak-Zuschlag-Pfeil bei Alter 17
  const a0=17,v0=AGE_CURVE.find(p=>p[0]===a0)[1];
  s.append(sv("line",{x1:X(a0),y1:Y(v0),x2:X(a0),y2:Y(peak[1]),stroke:"#FFC22D","stroke-width":1.5,"stroke-dasharray":"3 2"}));
  s.append(sv("circle",{cx:X(a0),cy:Y(v0),r:3,fill:"#FFC22D"}));
  s.append(sv("text",{x:X(a0)+6,y:(Y(v0)+Y(peak[1]))/2,fill:"#FFC22D","font-size":10},TX("Peak-Zuschlag","Peak adjustment")));
  s.append(sv("text",{x:X(16),y:Y(-0.5),"text-anchor":"middle",fill:"#8A93AD","font-size":10},TX("jung → verbessert sich","young → improving")));
  s.append(sv("text",{x:X(36),y:Y(0.08),"text-anchor":"middle",fill:"#8A93AD","font-size":10},TX("älter → lässt nach","older → declining")));
  host.append(s);
}

function drawFunnel(host){
  const W=640,H=120,N=20,L=20,R=20,gap=(W-L-R)/(N-1);
  const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Talent-Filter"});
  s.append(sv("text",{x:L,y:16,fill:"#8A93AD","font-size":11},TX("Ein Jahrgang – nach Peak-Rating sortiert (bester links)","One birth year – sorted by peak rating (best on the left)")));
  const cut=Math.round(N*0.2);
  for(let i=0;i<N;i++){
    const cxp=L+i*gap, top=i<cut;
    s.append(sv("circle",{cx:cxp,cy:60,r:top?9:6,fill:top?"#34B190":"#22263F",stroke:top?"#34B190":"#353649","stroke-width":1.5}));
  }
  // Klammer über Top 20 %
  const x1=L-9,x2=L+(cut-1)*gap+9;
  s.append(sv("path",{d:`M${x1} 40 v-6 h${x2-x1} v6`,fill:"none",stroke:"#34B190","stroke-width":1.5}));
  s.append(sv("text",{x:(x1+x2)/2,y:26,"text-anchor":"middle",fill:"#34B190","font-size":11,"font-weight":600},TX("Top 20 % → Shortlist","Top 20% → shortlist")));
  s.append(sv("text",{x:L,y:96,fill:"#8A93AD","font-size":11},TX("+ Mindestminuten-Schwelle: dämpft Zufall bei Spielern mit wenig Einsatzzeit","+ minimum-minutes threshold: dampens chance for players with little playing time")));
  host.append(s);
}

function explainEN(){ return `
  <div class="explain">
    <p class="lead"><b>Plus-minus (PM)</b> is a top-down rating: only the team result (goals) is
      observed, and credit/blame is distributed among the players on the pitch –
      <b>adjusted for teammates and opponents</b>. Every player gets an offensive and a
      defensive rating; their sum is the <b>Total rating</b>.</p>
    <p class="cite">Method: Hvattum (2020, <i>Applied Sciences</i>) &amp; Hvattum, Kriegl &amp; Čulík (2023),
      “Identifying talent with plus-minus ratings in association football”, in <i>Statistics Meets Sports</i>.</p>

    <div class="step"><div class="n">1</div><div class="body">
      <h3>From matches to segments</h3>
      <p>Every match is cut at each <b>substitution</b> and each <b>red card</b> into
        <b>segments</b> with an unchanged line-up. For each segment we know its duration,
        the players on the pitch and the goals per team.</p>
      <div class="viz"><div id="viz-timeline"></div>
        <div class="legend">
          <span><span class="sw" style="background:#22263F;border:1px solid #353649"></span>Player on the pitch</span>
          <span>⚽ Goal</span><span>⇄ Substitution = new segment boundary</span></div></div>
    </div></div>

    <div class="step"><div class="n">2</div><div class="body">
      <h3>Two perspectives per segment <span style="color:var(--muted);font-weight:400;font-size:13px">(Ilardi 2007)</span></h3>
      <p>Each segment yields <b>two observations</b>: one with <span class="t-off">the home team
        attacking</span> (how many goals does home score?) and one with <span class="t-def">the away team
        attacking</span>. This allows attack and defence to be estimated <b>separately</b>.</p>
    </div></div>

    <div class="step"><div class="n">3</div><div class="body">
      <h3>The basic equation</h3>
      <p>A team's expected goals in a segment ≈ sum of its own offensive ratings minus
        the sum of the opponents' defensive ratings, scaled by the segment duration:</p>
      <div class="eq">
        g<sup>H</sup> ≈ <span class="frac"><span>d</span><span class="den">90</span></span>
        · ( c + <span class="t-hfa">h</span>
        + <span class="t-off"><span class="big">Σ</span><sub>i∈Home</sub> β<sup>O</sup><sub>i</sub></span>
        − <span class="t-def"><span class="big">Σ</span><sub>j∈Away</sub> β<sup>D</sup><sub>j</sub></span>
        + <span class="t-man">μ·(n<sub>H</sub>−n<sub>A</sub>)</span> )
        <small>symmetric for away goals – with the away offensive and home defensive ratings, without home advantage <span class="t-hfa">h</span>.</small>
      </div>
      <table class="symtab">
        <tr><td>β<sup>O</sup><sub>i</sub>, β<sup>D</sup><sub>i</sub></td><td>Offensive / defensive rating of player i (goals per 90 min)</td></tr>
        <tr><td>d</td><td>Segment duration in minutes</td></tr>
        <tr><td>c</td><td>Base goal rate (intercept)</td></tr>
        <tr><td class="t-hfa">h</td><td>Home advantage</td></tr>
        <tr><td class="t-man">μ, n<sub>H</sub>/n<sub>A</sub></td><td>Numerical advantage effect and number of players per team (red cards)</td></tr>
      </table>
    </div></div>

    <div class="step"><div class="n">4</div><div class="body">
      <h3>The design matrix</h3>
      <p>All observations form a system of equations <span class="eq" style="display:inline-block;padding:2px 8px;font-size:15px">y = X·β + ε</span>.
        Rows = observations, columns = all players (an <span class="t-off">offensive</span> and a
        <span class="t-def">defensive block</span>) plus extra terms. <span class="t-off">+1</span> = player in
        his own team's attack, <span class="t-def">−1</span> = opponent defending. The matrix is
        <b>sparse</b> (example: home A,B,C – away D,E,F, substitution C→C₂ at 60′).</p>
      <div class="viz"><div id="viz-matrix"></div>
        <div class="legend">
          <span><span class="sw" style="background:#34B19033;border:1px solid #34B190"></span>+1 own attack</span>
          <span><span class="sw" style="background:#FF6F7033;border:1px solid #FF6F70"></span>−1 opponent (defence)</span>
          <span><span class="sw" style="background:#00B3F0"></span>y = goals scored</span></div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0">Values additionally scaled by d/90; the numerical-advantage term μ is 0 here (no red card).</p></div>
    </div></div>

    <div class="step"><div class="n">5</div><div class="body">
      <h3>Regularised estimation (ridge)</h3>
      <p>The ratings β minimise the weighted squared deviation between observed and
        modelled goals – plus a <b>penalty term</b> that pulls ratings towards 0 (average player):</p>
      <div class="eq">
        min<sub>β</sub> &nbsp;<span class="big">Σ</span><sub>m,s</sub>
        w·( <span class="t-off">f<sup>H</sup></span> − g<sup>H</sup> )²
        + w·( <span class="t-def">f<sup>A</sup></span> − g<sup>A</sup> )²
        + <span class="t-reg">λ <span class="big">Σ</span><sub>k</sub> β<sub>k</sub>²</span>
      </div>
      <div class="eq">
        β = ( X<sup>T</sup>W X + <span class="t-reg">λ</span> I )<sup>−1</sup> X<sup>T</sup>W y
      </div>
      <div class="note"><b>Why regularise?</b> A player with few minutes has hardly any
        data points – <b>λ</b> then keeps his rating close to 0 instead of assigning a random
        extreme. w weights segments by duration; for Off/Def/Total w is otherwise 1 – all seasons
        count equally. <b>Total cur.</b> is the same regression with a recency weight
        w = ½<sup>age in days / 365</sup> (half-life one season, reference date = latest match):
        the current season counts fully, last season half. λ is chosen by
        cross-validation in each case (in this dataset: λ≈30).</div>
    </div></div>

    <div class="step"><div class="n">6</div><div class="body">
      <h3>Age curve &amp; peak rating</h3>
      <p>Ratings are <b>not constant</b> but depend on age: young players improve,
        reach a peak and decline later. From the current Total rating and the age curve
        a <b>peak rating</b> is projected – this makes young and mature players comparable.</p>
      <div class="viz"><div id="viz-agecurve"></div></div>
      <div class="eq">
        peak = total + ( c<sub>max</sub> − c(age) ),
        &nbsp; total = <span class="t-off">β<sup>O</sup></span> + <span class="t-def">β<sup>D</sup></span>
        <small>c(·) is the age curve; c<sub>max</sub> its value at peak age (≈ 26).</small>
      </div>
    </div></div>

    <div class="step"><div class="n">7</div><div class="body">
      <h3>From rating to talent filter</h3>
      <p>Players are ranked into percentiles <b>within each birth year</b>. A cut-off (e.g. top 20%)
        forms the scouting shortlist. Because young players with few minutes have noisy ratings,
        <b>playing time</b> is taken into account as well (peak rating + minutes).</p>
      <div class="viz"><div id="viz-funnel"></div></div>
      <div class="note">Categories: <b>early developer</b> (identified &lt;17), <b>late developer</b> (17–20),
        <b>grassroots</b> (only in the data after 20). Result in the paper: with “peak + minutes, top 20%”
        about <b>80%</b> of the later most valuable players are identified early. → see the <b>Scouting</b> tab
        (column “Talent%”, filter “Talent percentile”).</div>
    </div></div>
  </div>`; }
function renderExplain(){
  const sec=$("#tab-explain");
  sec.innerHTML=LANG==="en"?explainEN():`
  <div class="explain">
    <p class="lead"><b>Plus-Minus (PM)</b> ist ein Top-down-Rating: Man beobachtet nur das
      Teamergebnis (Tore) und verteilt Verdienst/Schuld auf die Spieler auf dem Feld –
      <b>adjustiert für Mit- und Gegenspieler</b>. Jeder Spieler bekommt ein Offensiv- und ein
      Defensiv-Rating; ihre Summe ist das <b>Total-Rating</b>.</p>
    <p class="cite">Methodik: Hvattum (2020, <i>Applied Sciences</i>) &amp; Hvattum, Kriegl &amp; Čulík (2023),
      „Identifying talent with plus-minus ratings in association football“, in <i>Statistics Meets Sports</i>.</p>

    <div class="step"><div class="n">1</div><div class="body">
      <h3>Vom Spiel zu Segmenten</h3>
      <p>Jedes Spiel wird an jeder <b>Ein-/Auswechslung</b> und jeder <b>Roten Karte</b> in
        <b>Segmente</b> mit unveränderter Aufstellung geschnitten. Pro Segment kennt man Dauer,
        die anwesenden Spieler und die Tore je Team.</p>
      <div class="viz"><div id="viz-timeline"></div>
        <div class="legend">
          <span><span class="sw" style="background:#22263F;border:1px solid #353649"></span>Spieler auf dem Feld</span>
          <span>⚽ Tor</span><span>⇄ Wechsel = neue Segmentgrenze</span></div></div>
    </div></div>

    <div class="step"><div class="n">2</div><div class="body">
      <h3>Zwei Perspektiven je Segment <span style="color:var(--muted);font-weight:400;font-size:13px">(Ilardi 2007)</span></h3>
      <p>Jedes Segment liefert <b>zwei Beobachtungen</b>: einmal <span class="t-off">Heim in der
        Offensive</span> (wie viele Tore erzielt Heim?) und einmal <span class="t-def">Gast in der
        Offensive</span>. Dadurch lassen sich Angriff und Abwehr <b>getrennt</b> schätzen.</p>
    </div></div>

    <div class="step"><div class="n">3</div><div class="body">
      <h3>Die Grundgleichung</h3>
      <p>Die erwarteten Tore eines Teams im Segment ≈ Summe der eigenen Offensiv-Ratings minus
        Summe der gegnerischen Defensiv-Ratings, skaliert mit der Segmentdauer:</p>
      <div class="eq">
        g<sup>H</sup> ≈ <span class="frac"><span>d</span><span class="den">90</span></span>
        · ( c + <span class="t-hfa">h</span>
        + <span class="t-off"><span class="big">Σ</span><sub>i∈Heim</sub> β<sup>O</sup><sub>i</sub></span>
        − <span class="t-def"><span class="big">Σ</span><sub>j∈Gast</sub> β<sup>D</sup><sub>j</sub></span>
        + <span class="t-man">μ·(n<sub>H</sub>−n<sub>A</sub>)</span> )
        <small>für die Gasttore symmetrisch – mit den Gast-Offensiv- und Heim-Defensiv-Ratings, ohne Heimvorteil <span class="t-hfa">h</span>.</small>
      </div>
      <table class="symtab">
        <tr><td>β<sup>O</sup><sub>i</sub>, β<sup>D</sup><sub>i</sub></td><td>Offensiv- / Defensiv-Rating von Spieler i (Tore pro 90 min)</td></tr>
        <tr><td>d</td><td>Segmentdauer in Minuten</td></tr>
        <tr><td>c</td><td>Grund-Torrate (Basiswert)</td></tr>
        <tr><td class="t-hfa">h</td><td>Heimvorteil</td></tr>
        <tr><td class="t-man">μ, n<sub>H</sub>/n<sub>A</sub></td><td>Über-/Unterzahl-Effekt bzw. Spielerzahl je Team (Rote Karten)</td></tr>
      </table>
    </div></div>

    <div class="step"><div class="n">4</div><div class="body">
      <h3>Die Design-Matrix</h3>
      <p>Alle Beobachtungen ergeben ein Gleichungssystem <span class="eq" style="display:inline-block;padding:2px 8px;font-size:15px">y = X·β + ε</span>.
        Zeilen = Beobachtungen, Spalten = alle Spieler (ein <span class="t-off">Offensiv-</span> und ein
        <span class="t-def">Defensiv-Block</span>) plus Zusatzterme. <span class="t-off">+1</span> = Spieler im
        eigenen Angriff, <span class="t-def">−1</span> = Gegenspieler in der Abwehr. Die Matrix ist
        <b>dünn besetzt</b> (Beispiel: Heim A,B,C – Gast D,E,F, Wechsel C→C₂ bei 60′).</p>
      <div class="viz"><div id="viz-matrix"></div>
        <div class="legend">
          <span><span class="sw" style="background:#34B19033;border:1px solid #34B190"></span>+1 eigener Angriff</span>
          <span><span class="sw" style="background:#FF6F7033;border:1px solid #FF6F70"></span>−1 Gegner (Abwehr)</span>
          <span><span class="sw" style="background:#00B3F0"></span>y = erzielte Tore</span></div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0">Werte zusätzlich mit d/90 skaliert; der Über-/Unterzahl-Term μ ist hier 0 (keine Rote Karte).</p></div>
    </div></div>

    <div class="step"><div class="n">5</div><div class="body">
      <h3>Regularisierte Schätzung (Ridge)</h3>
      <p>Die Ratings β minimieren die gewichtete quadratische Abweichung zwischen beobachteten und
        modellierten Toren – plus einen <b>Strafterm</b>, der Ratings gegen 0 (Durchschnittsspieler) zieht:</p>
      <div class="eq">
        min<sub>β</sub> &nbsp;<span class="big">Σ</span><sub>m,s</sub>
        w·( <span class="t-off">f<sup>H</sup></span> − g<sup>H</sup> )²
        + w·( <span class="t-def">f<sup>A</sup></span> − g<sup>A</sup> )²
        + <span class="t-reg">λ <span class="big">Σ</span><sub>k</sub> β<sub>k</sub>²</span>
      </div>
      <div class="eq">
        β = ( X<sup>T</sup>W X + <span class="t-reg">λ</span> I )<sup>−1</sup> X<sup>T</sup>W y
      </div>
      <div class="note"><b>Warum die Regularisierung?</b> Ein Spieler mit wenigen Minuten hat kaum
        Datenpunkte – <b>λ</b> hält sein Rating dann nahe 0, statt ihm ein zufälliges Extrem
        zuzuweisen. w gewichtet Segmente nach Dauer; für Off/Def/Total ist w sonst 1 – alle Saisonen
        zählen gleich. <b>Total akt.</b> ist dieselbe Regression mit Aktualitätsgewicht
        w = ½<sup>Alter in Tagen / 365</sup> (Halbwertszeit eine Saison, Bezugsdatum = neuestes Spiel):
        die laufende Saison zählt voll, die Vorsaison halb. λ wird jeweils per
        Cross-Validation gewählt (im Datensatz: λ≈30).</div>
    </div></div>

    <div class="step"><div class="n">6</div><div class="body">
      <h3>Alterskurve &amp; Peak-Rating</h3>
      <p>Ratings sind <b>keine Konstante</b>, sondern altersabhängig: junge Spieler verbessern sich,
        erreichen ein Hoch und lassen später nach. Aus dem aktuellen Total-Rating und der Alterskurve
        wird ein <b>Peak-Rating</b> projiziert – so werden junge und reife Spieler vergleichbar.</p>
      <div class="viz"><div id="viz-agecurve"></div></div>
      <div class="eq">
        peak = total + ( c<sub>max</sub> − c(Alter) ),
        &nbsp; total = <span class="t-off">β<sup>O</sup></span> + <span class="t-def">β<sup>D</sup></span>
        <small>c(·) ist die Alterskurve; c<sub>max</sub> ihr Wert im Leistungshoch (≈ 26 J.).</small>
      </div>
    </div></div>

    <div class="step"><div class="n">7</div><div class="body">
      <h3>Vom Rating zum Talent-Filter</h3>
      <p>Spieler werden <b>je Geburtsjahrgang</b> in Perzentile gerankt. Ein Cut-off (z. B. Top 20 %)
        bildet die Scouting-Shortlist. Da junge Spieler mit wenig Minuten verrauschte Ratings haben,
        wird zusätzlich die <b>Spielzeit</b> einbezogen (Peak-Rating + Minuten).</p>
      <div class="viz"><div id="viz-funnel"></div></div>
      <div class="note">Kategorien: <b>Early developer</b> (&lt;17 erkannt), <b>Late developer</b> (17–20),
        <b>Grassroots</b> (erst &gt;20 in den Daten). Ergebnis im Paper: mit „Peak + Minuten, Top 20 %"
        werden ~<b>80 %</b> der später wertvollsten Spieler früh erkannt. → siehe Tab <b>Scouting</b>
        (Spalte „Talent%", Filter „Talent-Perzentil").</div>
    </div></div>
  </div>`;
  drawTimeline($("#viz-timeline"));
  drawMatrix($("#viz-matrix"));
  drawAgeCurve($("#viz-agecurve"));
  drawFunnel($("#viz-funnel"));
}


/* ---------- init: Tabs leer rendern, EIN fetch (scout.json), dann Hash-Route ---------- */
function setPills(d){
  const pills=[["#pillP",`<b>${nf((d.stats&&d.stats.players_with_id)||state.rows.filter(r=>r.id).length)}</b> ${TX("Spieler","players")}`],
               ["#pillR",`<b>${nf(state.rows.filter(r=>r.total!=null).length)}</b> Ratings`],
               ["#pillM",`<b>${nf((d.stats&&d.stats.matches)||0)}</b> Matches`],
               ["#pillD",`${TX("Stand","Data as of")} ${hesc(fmtBuilt(d.built))}`]];
  pills.forEach(([s,t])=>{const p=$(s); p.innerHTML=t; p.classList.add("on"); p.classList.remove("err");});
}
/* Statische Texte (Titel, Navigation, Kopfzeile) in der aktiven Sprache */
function applyLang(){
  document.documentElement.lang=LANG;
  document.title=TX("ÖFB Scouting – Spieler-Datenbank","ÖFB Scouting – Player Database");
  $("#hSub").textContent=TX("Spieler-Datenbank","Player database");
  const NAV={scout:"Scouting",profile:TX("Spieler","Players"),stats:TX("Statistik","Statistics"),explain:TX("Methodik","Method"),matches:"Matches"};
  document.querySelectorAll("nav button").forEach(b=>{b.textContent=NAV[b.dataset.tab]||b.textContent;});
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("active",b.dataset.lang===LANG));
  $("#pillD").title=TX("Stand der vorberechneten Daten","Build time of the precomputed data");
  if(!state.scout&&!state.loadErr)$("#pillP").textContent=TX("lädt…","loading…");
}
/* Sprachwechsel ohne Neuladen: alle Tabs neu rendern; Filter (state.fs), Vorlage, Sortierung und offenes Profil bleiben */
function setLang(l){
  if(l!=="de"&&l!=="en"||l===LANG)return;
  LANG=l; try{localStorage.setItem("oefb-lang",l);}catch(e){}
  applyLang();
  const active=(document.querySelector("nav button.active")||{dataset:{tab:"scout"}}).dataset.tab;
  safe(renderScout); safe(renderStats); safe(renderExplain);
  const pid=state.profileId; state.profileId=null; $("#tab-profile").innerHTML=""; state._pfBody=null; safe(renderProfileShell);
  state.open=null; state.openDetail=null; safe(renderMatches);
  if(state.scout)setPills(state.scout);
  if(pid){ openProfile(pid); if(active!=="profile")switchTab(active); }
  else if(onShow[active])onShow[active]();
}
document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
function init(){
  applyLang();
  safe(renderScout); safe(renderStats); safe(renderExplain); safe(renderProfileShell); safe(renderMatches);
  safe(route);           // Tab/Profil aus dem Hash sofort: Methodik, Matches und Profile brauchen scout.json nicht
  loadScout();
}
/* scout.json laden (auch Retry-Callback): rendert nur die davon abhaengigen Tabs neu – Matches-Filter,
   offenes Spiel-Detail und ein offenes Profil bleiben erhalten. */
async function loadScout(){
  state.loadErr=null;
  const t0=performance.now();
  try{
    const d=await fetchJSON("data/scout.json");
    setPerf("fetch",performance.now()-t0);
    const t1=performance.now();
    state.scout=d; state.rows=decodeScout(d); state.curSeason=curSeason(d);
    state.hasSea=!!(state.curSeason&&d.cols.includes("sea"));   // Saisondaten erst ab scout.json v2
    state.hasCur=d.cols.includes("total_cur");                   // zeitgewichtetes Total erst ab scout.json v3
    state.byId=new Map(); for(const r of state.rows)if(r.id)state.byId.set(r.id,r);
    setPerf("decode",performance.now()-t1);
    setPills(d);
  }catch(e){
    console.error(e); state.loadErr=e.message;
    const p=$("#pillP"); p.textContent=TX("Fehler","Error"); p.classList.add("err");
  }
  safe(renderScout); safe(renderStats); safe(renderProfileShell);
  const tab=document.querySelector("nav button.active");
  if(tab&&onShow[tab.dataset.tab])onShow[tab.dataset.tab]();   // sichtbare Tabelle gleich korrekt messen
}
init();
